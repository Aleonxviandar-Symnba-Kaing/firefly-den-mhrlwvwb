<title>Star Lion 2 - Leon style samples</title>
<style>
html,body{margin:0;background:#0d0a12;color:#f3e6c8;font-family:'Courier New',monospace;-webkit-text-size-adjust:100%}
.wrap{max-width:1180px;margin:0 auto;padding:18px 14px 40px}
h1{font-size:20px;letter-spacing:2px;color:#ffd36a;margin:4px 0 2px}
.sub{color:#b9a8c9;font-size:13px;margin-bottom:14px}
.notes{border:1px solid #ffd36a55;background:#1c1226;padding:10px 14px;font-size:13px;line-height:1.5;margin-bottom:16px}
.notes b{color:#ffd36a}
.grid{display:grid;grid-template-columns:120px repeat(3,1fr);gap:10px;align-items:start}
.ch{background:#1c1226;border:1px solid #ffd36a;padding:8px;font-size:12px;line-height:1.35;min-height:84px}
.ch b{display:block;color:#ffd36a;font-size:14px;letter-spacing:1px;margin-bottom:4px}
.rh{background:#1c1226;border:1px solid #ffd36a55;padding:8px;font-size:12px;line-height:1.35;align-self:stretch}
.rh b{display:block;color:#ffd36a;font-size:14px;margin-bottom:4px}
.cell{background:#140d1c;border:1px solid #3a2a48;padding:6px}
.cell canvas{width:100%;height:auto;image-rendering:pixelated;image-rendering:crisp-edges;display:block}
.cap{font-size:11px;color:#b9a8c9;margin-top:4px}
.rowlab{display:none}
.pnav{margin:6px 0 12px;font-size:14px;letter-spacing:1px}.pnav a,.pnav span{display:inline-block;padding:5px 12px;margin-right:6px;border:1px solid #ffd36a;color:#ffd36a;text-decoration:none}.pnav span{background:#ffd36a;color:#2a1834}#nav2{margin-top:18px}
.cl{display:flex;gap:6px;align-items:flex-end}.cl figure{margin:0;flex:1}.cl canvas{width:100%;image-rendering:pixelated;image-rendering:crisp-edges;display:block}.cl figcaption{font-size:11px;color:#b9a8c9;text-align:center;margin-top:3px}
.bar{margin:0 0 12px;font-size:13px}.bar button{background:#2a1834;color:#ffd36a;border:1px solid #ffd36a;padding:4px 10px;font:inherit;cursor:pointer;margin-right:6px}
.bar button.on{background:#ffd36a;color:#2a1834}
.big{display:flex;gap:6px;margin-top:6px}.big canvas{width:33%;image-rendering:pixelated;image-rendering:crisp-edges}
@media (max-width:760px){.grid{grid-template-columns:1fr}.hdr{display:none}.rh{display:none}.rowlab{display:block;color:#ffd36a;font-size:13px;margin:14px 0 2px}}
</style></head><body><div class="wrap">

  return out;
}

function panel(x,y,w,h,col,g){ g=g||CTX; g.fillStyle=col||"rgba(28,18,38,0.92)"; g.fillRect(x,y,w,h); g.strokeStyle="#ffd36a"; g.lineWidth=1; g.strokeRect(x+0.5,y+0.5,w-1,h-1); g.strokeStyle="rgba(255,211,106,0.35)"; g.strokeRect(x+2.5,y+2.5,w-5,h-5); }
function bustCard(g,x,y,w,h,wrong){ const gr=g.createLinearGradient(0,y,0,y+h); if(wrong){ gr.addColorStop(0,"#6a6478"); gr.addColorStop(1,"#3a3444"); } else { gr.addColorStop(0,"#8ad4ff"); gr.addColorStop(0.62,"#ffe9a8"); gr.addColorStop(1,"#ffb85a"); }
  px(g,x-1,y-1,w+2,h+2,"#22142e"); g.fillStyle=gr; g.fillRect(x,y,w,h);
  if(!wrong){ g.save(); g.beginPath(); g.rect(x,y,w,h); g.clip(); g.globalAlpha=0.22; g.fillStyle="#fff6d0"; const cx=x+w*0.7, cy=y+h*0.15, r0=(S.rm?0:T*0.15);
    for(let i=0;i<10;i++){ const a=r0+i*Math.PI/5; g.beginPath(); g.moveTo(cx,cy); g.lineTo(cx+Math.cos(a)*90,cy+Math.sin(a)*90); g.lineTo(cx+Math.cos(a+0.16)*90,cy+Math.sin(a+0.16)*90); g.fill(); }
    g.restore(); }
  px(g,x,y,w,1,wrong?"#8a8498":"#ffffff"); }
const STY=[["toon","1 · TOON","Rounder shapes, bigger eyes, flat colour, bold dark outlines, simplified muzzle. Fewest colours, no dither."],
 ["mid","2 · IN-BETWEEN","90s hand-drawn furry-toon: cel shading, rim light, more lion anatomy, still expressive. (Closest to the current game.)"],
 ["unc","3 · UNCANNY","Realistic proportions, longer muzzle, smaller eyes, fur-texture dither, subtle shading, no hard outline. Slightly 'off', never scary."]];
const ERA=[["cub","CUB","Golden, small red-auburn tuft, big warm eyes.","FEN SAYS THE STARS ARE JUST LANTERNS FOR LIONS."],
 ["teen","TEEN (default)","Feathered 80s-90s blowout, ear hoops, NO face paint.","IT'S NOT A DATE. PROBABLY. HOW'S THE MANE?"],
 ["adult","ADULT (default)","Full red-auburn mane, NO crown, NO necklace.","NOT YET. A CROWN IS SOMETHING YOU ANSWER FOR."],
 ["dress","TEEN · DRESS TO IMPRESS","Optional Ch2 look: bolt face paint, star mark, hoops, purple-star choker, studded cuffs.","PAINT. HOOPS. BLOWOUT. TOO MUCH? ...NO. PERFECT."]];
/* ---- PAGES: add page 3, 4... by appending an entry. Row kinds: "cell" (dialogue box + sprite) or "close" (big portraits). ---- */
const P1ROWS=ERA.map(([e,en,ed,line])=>({kind:"cell",label:en,desc:ed,line,bust:st=>"b_"+st+"_"+e,spr:st=>"s_"+st+"_"+e}));
const PAGES=[
 {title:"Page 1", head:`<h1>STAR LION 2 &middot; LEON STYLE SAMPLES</h1>
<div class="sub">Test page only. Nothing here is in the game yet. Each cell is drawn with the game's own dialogue-box code (panel, bust card, pixel font) at the game's bust size (60&times;60) with the in-game sprite on the firefly-meadow background.</div>
<div class="notes"><b>Design decisions (Simba), applied to these samples only:</b><br>
&bull; Adult Leon: <b>no crown, no necklace</b> by default. The crown stands for accepting responsibility and accountability, so it is earned later.<br>
&bull; Teen Leon: <b>no face paint</b> by default. Paint is the optional <b>DRESS TO IMPRESS</b> look for the deeper Ch2 date dress-up (ear hoops kept; also on the default here).<br>
&bull; Cub Leon unchanged: golden, small red-auburn tuft, big warm eyes.<br>
&bull; Original designs, SFW. The teen blowout is a hairstyle archetype only.</div>`, rows:P1ROWS},
 {title:"Page 2", head:`<h1>STAR LION 2 &middot; LEON STYLE SAMPLES &middot; PAGE 2</h1>
<div class="sub">Same grid as page 1, with ADULT LEON redrawn from Simba's reference recipe. Cub, teen and dress-to-impress are unchanged from page 1 (no tweaks were needed for family resemblance). Test page only; nothing here is in the game.</div>
<div class="notes"><b>Adult Leon recipe (page 2):</b><br>
&bull; <b>Face:</b> broad, strong, slightly long face; wide squarish jaw and chin; big cream muzzle and chin patch; wide rounded maroon-brown nose; warm gold with darker gold around the eyes.<br>
&bull; <b>Brows:</b> thick, clearly drawn, gently arched, low and soft over the eyes (kind, content); they lift high when he laughs.<br>
&bull; <b>Eyes:</b> medium-small almond, amber-gold, often half-lidded and smiling.<br>
&bull; <b>Mane:</b> huge shaggy layered chestnut/rust-auburn locks, lumpy wavy outline, a messy forelock on the forehead, wraps under the chin into a big chest bib; rounded golden ears poke through.<br>
&bull; Still <b>no crown and no necklace</b>. Teen default has no face paint; paint is the dress-to-impress look.</div>`,
  rows:[P1ROWS[0],P1ROWS[1],
   {kind:"cell",label:"ADULT (default) · NEW",desc:"Reference recipe: broad squarish jaw, thick low brows, almond half-lidded eyes, shaggy chestnut mane with forelock and chin/chest wrap. NO crown, NO necklace.",line:"NOT YET. A CROWN IS SOMETHING YOU ANSWER FOR.",bust:st=>"b2_"+st+"_adult",spr:st=>st==="toon"?"s2_toon_adult":"s_"+st+"_adult"},
   P1ROWS[3],
   {kind:"close",label:"ADULT CLOSEUP",desc:"120&times;120 portraits (2&times; the dialogue bust) so the face is readable: content smile with low soft brows, and the big laugh with brows lifted.",imgs:st=>[["c2_"+st+"_adult","content"],["c2_"+st+"_laugh","laughing"]]}]}
];
const PN=Math.min(PAGES.length,Math.max(1,parseInt(new URLSearchParams(location.search).get("p")||"1",10)||1)), PG=PAGES[PN-1];
const load=s=>new Promise(r=>{const i=new Image(); i.onload=()=>r(i); i.src=s;});
const CW=168, CH=114, cells=[];
function drawCell(c){ const g=c.g; g.imageSmoothingEnabled=false; g.clearRect(0,0,CW,CH);
  g.drawImage(c.bg,74,70,CW,58,0,0,CW,58); px(g,0,50,CW,1,"#8cc45a"); px(g,0,51,CW,1,"#5a8a3a"); px(g,0,52,CW,6,"#2a1c24"); px(g,0,54,CW,1,"#3a2832");
  const s=c.spr; g.drawImage(s,Math.round(CW/2-s.width/2),51-s.height);
  const y=CH-54; panel(2,y,CW-4,52,null,g); bustCard(g,7,y+5,54,42,false);
  g.save(); g.beginPath(); g.rect(7,y-16,54,63); g.clip(); g.drawImage(c.bust,4,y-13); g.restore();
  const tx=68; px(g,tx-2,y-5,4*6+6,10,"#ffd36a"); drawText(g,"LEON",tx+1,y-3,{c:"#2a1834"});
  wrap(c.line,15).slice(0,4).forEach((l,i)=>drawText(g,l,tx,y+8+i*10,{c:"#fff4dc"})); }
function navHTML(){ return PAGES.map((p,i)=>i+1===PN?`<span>${p.title.toUpperCase()}</span>`:`<a href="?p=${i+1}">${p.title.toUpperCase()}</a>`).join(""); }
(async()=>{ document.getElementById('nav1').innerHTML=navHTML(); document.getElementById('nav2').innerHTML=navHTML(); document.getElementById('head').innerHTML=PG.head;
  document.title="Star Lion 2 - Leon style samples"+(PN>1?" - page "+PN:"");
  const G=document.getElementById('g'); const bg=await load(IMG.bg);
  G.insertAdjacentHTML('beforeend','<div class="hdr"></div>'+STY.map(s=>`<div class="ch hdr"><b>${s[1]}</b>${s[2]}</div>`).join(''));
  for(const R of PG.rows){
    G.insertAdjacentHTML('beforeend',`<div class="rh"><b>${R.label}</b>${R.desc}</div>`);
    for(const [st,sn] of STY){
      const d=document.createElement('div'); d.className='cell'; d.innerHTML=`<div class="rowlab">${R.label} &middot; ${sn}</div>`;
      if(R.kind==="close"){ const row=document.createElement('div'); row.className='cl';
        for(const [k,cap] of R.imgs(st)){ const im=await load(IMG[k]); const f=document.createElement('figure'); const cv=document.createElement('canvas'); cv.width=im.width+4; cv.height=im.height+4;
          const g=cv.getContext('2d'); g.imageSmoothingEnabled=false; bustCard(g,2,2,im.width,im.height,false); g.drawImage(im,2,2); f.appendChild(cv); f.insertAdjacentHTML('beforeend',`<figcaption>${cap}</figcaption>`); row.appendChild(f);
          cells.push({close:true,g,im}); }
        d.appendChild(row); d.insertAdjacentHTML('beforeend',`<div class="cap">closeup ${R.imgs(st).length}&times; 120&times;120 (shown larger than the game uses)</div>`); G.appendChild(d); continue; }
      const cv=document.createElement('canvas'); cv.width=CW; cv.height=CH; d.appendChild(cv);
      const bust=await load(IMG[R.bust(st)]), spr=await load(IMG[R.spr(st)]);
      const big=document.createElement('div'); big.className='big';
      for(const [im,w,h] of [[bust,60,60],[spr,spr.width,spr.height]]){ const b=document.createElement('canvas'); b.width=w; b.height=h; const bg2=b.getContext('2d'); bg2.drawImage(im,0,0); if(im===spr){ b.style.width=(spr.width/60*33)+'%'; b.style.alignSelf='flex-end'; } big.appendChild(b); }
      d.insertAdjacentHTML('beforeend',`<div class="cap">bust 60&times;60 &middot; sprite ${spr.width}&times;${spr.height} px (game size)</div>`); d.appendChild(big);
      G.appendChild(d); const c={g:cv.getContext('2d'),bg,bust,spr,line:R.line}; cells.push(c); drawCell(c); } }
  window.__ready=true; })();
function zoom(z){ document.querySelectorAll('.bar button').forEach(b=>b.classList.toggle('on',+b.dataset.z===z));
  document.querySelectorAll('.cell>canvas').forEach(c=>{ c.style.width=z===2?'100%':(CW*z)+'px'; c.style.maxWidth='100%'; });
  document.getElementById('zt').textContent=z===1?'(true pixel size, as small as it gets)':z===3?'(3x, about the desktop game scale)':''; }
document.querySelectorAll('.bar button').forEach(b=>b.onclick=()=>zoom(+b.dataset.z));
let last=0; function tick(now){ if(!S.rm&&now-last>100){ last=now; T=now/1000; cells.forEach(c=>{ if(c.close){ const w=c.im.width,h=c.im.height; c.g.clearRect(0,0,w+4,h+4); bustCard(c.g,2,2,w,h,false); c.g.drawImage(c.im,2,2); } else drawCell(c); }); } requestAnimationFrame(tick); } requestAnimationFrame(tick);
</script></body></html>
