<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="icon" href="data:,"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Star Lion 2 - Leon style samples</title>
<style>
html,body{margin:0;background:#0d0a12;color:#f3e6c8;font-family:'Courier New',monospace;-webkit-text-size-adjust:100%}
.wrap{max-width:1180px;margin:0 auto;padding:18px 14px 40px}
h1{font-size:20px;letter-spacing:2px;color:#ffd36a;margin:4px 0 2px}
.sub{color:#b9a8c9;font-size:13px;margin-bottom:14px}
.notes{border:1px solid #ffd36a55;background:#1c1226;padding:10px 14px;font-size:13px;line-height:1.5;margin-bottom:16px}
.notes b{color:#ffd36a}
.grid{display:grid;grid-template-columns:120px repeat(3,1fr);gap:10px;align-items:start}
.ch{background:#1c1226;border:1px solid #ffd36a;padding:8px;font-size:12px;line-height:1.35;min-height:84px}
.ch b{display:block;color:#ffd36a;font-size:14px;letter-spacing:1px;margin-bottom:4px}
.rh{background:#1c1226;border:1px solid #ffd36a55;padding:8px;font-size:12px;line-height:1.35;align-self:stretch}
.rh b{display:block;color:#ffd36a;font-size:14px;margin-bottom:4px}
.cell{background:#140d1c;border:1px solid #3a2a48;padding:6px}
.cell canvas{width:100%;height:auto;image-rendering:pixelated;image-rendering:crisp-edges;display:block}
.cap{font-size:11px;color:#b9a8c9;margin-top:4px}
.rowlab{display:none}
.pnav{margin:6px 0 12px;font-size:14px;letter-spacing:1px}.pnav a,.pnav span{display:inline-block;padding:5px 12px;margin-right:6px;border:1px solid #ffd36a;color:#ffd36a;text-decoration:none}.pnav span{background:#ffd36a;color:#2a1834}#nav2{margin-top:18px}
.cl{display:flex;gap:6px;align-items:flex-end}.cl figure{margin:0;flex:1}.cl canvas{width:100%;image-rendering:pixelated;image-rendering:crisp-edges;display:block}.cl figcaption{font-size:11px;color:#b9a8c9;text-align:center;margin-top:3px}
.bar{margin:0 0 12px;font-size:13px}.bar button{background:#2a1834;color:#ffd36a;border:1px solid #ffd36a;padding:4px 10px;font:inherit;cursor:pointer;margin-right:6px}
.bar button.on{background:#ffd36a;color:#2a1834}
.big{display:flex;gap:6px;margin-top:6px}.big canvas{width:33%;image-rendering:pixelated;image-rendering:crisp-edges}
@media (max-width:760px){.grid{grid-template-columns:1fr}.hdr{display:none}.rh{display:none}.rowlab{display:block;color:#ffd36a;font-size:13px;margin:14px 0 2px}}
.sh{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:14px;background:#1c1226;border:1px solid #ffd36a;padding:12px;margin-bottom:18px}
.sh .por{display:flex;gap:8px}.sh .por figure{margin:0;flex:1;position:relative}.sh .por img{width:100%;display:block;border:1px solid #3a2a48}
.sh figcaption{font-size:11px;color:#b9a8c9;text-align:center;margin-top:3px}
.sh h2{margin:0;font-size:26px;letter-spacing:3px;color:#ffd36a}.sh .role{font-size:15px;color:#f3e6c8;font-style:italic;margin:2px 0 10px}
.sh h3{font-size:12px;letter-spacing:2px;margin:10px 0 3px;color:#ffd36a}.sh ul{margin:0;padding-left:18px;font-size:13px;line-height:1.45}
.sh .s li::marker{color:#8ee07a}.sh .w li::marker{color:#ff8a8a}.sh .ab{border:1px solid #ffd36a77;background:#140d1c;padding:7px 10px;font-size:13px;line-height:1.4;margin-top:4px}.sh .ab b{color:#ffd36a;letter-spacing:2px}
.sh .ig{grid-column:1/-1;display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;border-top:1px solid #3a2a48;padding-top:10px}.sh .ig figure{margin:0}.sh .ig canvas{image-rendering:pixelated;image-rendering:crisp-edges;display:block}
.sh .por img.nick{width:30%;position:absolute;left:6px;bottom:26px;border:2px solid #ffd36a}
@media (max-width:760px){.sh{grid-template-columns:1fr}.sh h2{font-size:22px}}
</style></head><body><div class="wrap">

function textWidth(str,s){ return String(str).length*6*(s||1); }
function drawText(g,str,x,y,opt){
  opt=opt||{};

  str=String(str).toUpperCase();
  const w=str.length*6*s;
  let ox=x; if(align==="center") ox=Math.round(x-w/2); if(align==="right") ox=Math.round(x-w);
  const oy=Math.round(y);
  for(let n=0;n<str.length;n++){
    const rows=FONT[str[n]]; const px=ox+n*6*s; if(!rows) continue;
    if(shadow){ g.fillStyle=shadow; for(let j=0;j<7;j++) for(let i=0;i<5;i++) if(rows[j]&(1<<(4-i))) g.fillRect(px+i*s+s, oy+j*s+s, s, s); }
    g.fillStyle=col; for(let j=0;j<7;j++) for(let i=0;i<5;i++) if(rows[j]&(1<<(4-i))) g.fillRect(px+i*s, oy+j*s, s, s);

}
function wrap(str, maxChars){
  const out=[]; String(str).split("\n").forEach(par=>{
    const words=par.split(" "); let cur="";
    for(const w of words){ if(!cur.length) cur=w; else if((cur+" "+w).length<=maxChars) cur+=" "+w; else { out.push(cur); cur=w; } }
    out.push(cur);
  });
  return out;
}

 {title:"Page 4", sheet:[{"id": "leon_adult", "name": "LEON", "role": "Dreamer and heart-reader.", "feat": ["Proportional almond eyes with relaxed, slightly heavy lids, outer corners tilting up, gazing at the sky: warm amber that glows red-orange toward the pupil", "Soft, thick, dark-brown brows, gently lifted in the middle: a mystified look of wonder", "Rounded, upright golden ears with darker insides", "Longer, straight nose bridge on a soft cat-head muzzle; serene closed-mouth content smile, head tilted up", "A forelock of mane falling forward over the forehead", "Huge windswept chestnut-auburn mane past the shoulders; golden-amber fur, cream muzzle, dusky rose nose; no crown, no necklace"], "str": ["Empathy", "Song", "Sees hidden things: fireflies, runes, truth in reflections"], "weak": ["Freezes when fear rises", "Carries guilt"], "ab": ["ROAR", "Calms or breaks spells. Stronger when he trusts his companion."], "line": "I DON'T NEED TO BE LOUD TO BE HEARD."}, {"id": "kael", "name": "KAEL", "role": "Steady older protector who jokes to hide worry.", "feat": ["Heavier, lower brows", "Narrower, slightly droopy green eyes", "A nick scar on one ear", "Broader, squarer muzzle", "Crooked half-grin; a wide open-mouth laugh", "Long black mane, beaded braid, white-pink flowers, lion tail"], "str": ["Strength", "Tracking", "Calm when things go wrong"], "weak": ["Stubborn", "Guarded about his own pain"], "ab": ["SHOULDER", "Takes a hit for Leon, or pushes through blocked paths."], "line": "PUZZLE? NAH. STAND BACK."}],
  head:`<h1>STAR LION 2 &middot; CHARACTER SHEETS &middot; PAGE 4 &middot; LEON &amp; KAEL</h1>
<div class="sub">Who they are and how to tell them apart at a glance. Large portraits are the full-resolution source art the game busts are cut from (scaled down, no new painting). The row under each sheet is what the game actually draws: the four 60&times;60 dialogue busts at 2&times; and the walking sprite at 3&times;. Pages 1 to 3 are unchanged.</div>`}
];
const PN=Math.min(PAGES.length,Math.max(1,parseInt(new URLSearchParams(location.search).get("p")||"1",10)||1)), PG=PAGES[PN-1];
const load=s=>new Promise(r=>{const i=new Image(); i.onload=()=>r(i); i.src=s;});
const CW=168, CH=114, cells=[];
function drawCell(c){ const g=c.g; g.imageSmoothingEnabled=false; g.clearRect(0,0,CW,CH);
  g.drawImage(c.bg,74,70,CW,58,0,0,CW,58); px(g,0,50,CW,1,"#8cc45a"); px(g,0,51,CW,1,"#5a8a3a"); px(g,0,52,CW,6,"#2a1c24"); px(g,0,54,CW,1,"#3a2832");
  const s=c.spr; g.drawImage(s,Math.round(CW/2-s.width/2),51-s.height);
  const y=CH-54; panel(2,y,CW-4,52,null,g); bustCard(g,7,y+5,54,42,false);
  g.save(); g.beginPath(); g.rect(7,y-16,54,63); g.clip(); g.drawImage(c.bust,4,y-13); g.restore();
  const tx=68, nm=c.name||"LEON"; px(g,tx-2,y-5,nm.length*6+6,10,"#ffd36a"); drawText(g,nm,tx+1,y-3,{c:"#2a1834"});
  wrap(c.line,15).slice(0,4).forEach((l,i)=>drawText(g,l,tx,y+8+i*10,{c:"#fff4dc"})); }
function navHTML(){ return PAGES.map((p,i)=>i+1===PN?`<span>${p.title.toUpperCase()}</span>`:`<a href="?p=${i+1}">${p.title.toUpperCase()}</a>`).join(""); }

async function renderSheets(){ document.querySelector('.bar').style.display='none'; const G=document.getElementById('g'); G.style.display='block';
  for(const c of PG.sheet){ const d=document.createElement('section'); d.className='sh'; d.id='sheet_'+c.id;
    const nick=c.id==='kael'&&IMG.p4_kael_nick?`<img class="nick" src="${IMG.p4_kael_nick}" alt="ear nick close-up">`:'';
    d.innerHTML=`<div class="por"><figure><img src="${IMG['p4_'+c.id+'_neutral_por']}" alt="${c.name} neutral portrait">${nick}<figcaption>neutral${nick?' &middot; inset: the ear nick':''}</figcaption></figure><figure><img src="${IMG['p4_'+c.id+'_happy_por']}" alt="${c.name} happy portrait"><figcaption>${c.id==='kael'?'the open-mouth laugh':'the dreamer smile'}</figcaption></figure></div>
<div><h2>${c.name}</h2><div class="role">${c.role}</div><h3>DISTINCT FEATURES</h3><ul>${c.feat.map(x=>`<li>${x}</li>`).join('')}</ul>
<h3>STRENGTHS</h3><ul class="s">${c.str.map(x=>`<li>${x}</li>`).join('')}</ul><h3>WEAKNESSES</h3><ul class="w">${c.weak.map(x=>`<li>${x}</li>`).join('')}</ul>
<h3>ABILITY</h3><div class="ab"><b>${c.ab[0]}</b> &middot; ${c.ab[1]}</div></div><div class="ig"></div>`;
    G.appendChild(d); const ig=d.querySelector('.ig');
    for(const m of ['neutral','happy','worried','scared']){ const im=await load(IMG['p4_'+c.id+'_'+m]); const f=document.createElement('figure'); const cv=document.createElement('canvas'); cv.width=64; cv.height=64; cv.style.width='128px';
      const g=cv.getContext('2d'); g.imageSmoothingEnabled=false; bustCard(g,2,2,60,60,false); g.drawImage(im,2,2); f.appendChild(cv); f.insertAdjacentHTML('beforeend',`<figcaption>${m}</figcaption>`); ig.appendChild(f); }
    const sp=await load(IMG['p4_'+c.id+'_spr']); const f=document.createElement('figure'); const cv=document.createElement('canvas'); cv.width=sp.width; cv.height=sp.height; cv.style.width=(sp.width*3)+'px';
    const g=cv.getContext('2d'); g.drawImage(sp,0,0); f.appendChild(cv); f.insertAdjacentHTML('beforeend','<figcaption>sprite 3&times;</figcaption>'); ig.appendChild(f); }
  window.__ready=true; }
(async()=>{ document.getElementById('nav1').innerHTML=navHTML(); document.getElementById('nav2').innerHTML=navHTML(); document.getElementById('head').innerHTML=PG.head;
  document.title="Star Lion 2 - Leon style samples"+(PN>1?" - page "+PN:"");
  if(PG.sheet){ await renderSheets(); return; }
  const G=document.getElementById('g'); const bg=await load(IMG.bg);
  G.insertAdjacentHTML('beforeend','<div class="hdr"></div>'+(PG.sty||STY).map(s=>`<div class="ch hdr"><b>${s[1]}</b>${s[2]}</div>`).join(''));
  for(const R of PG.rows){
    G.insertAdjacentHTML('beforeend',`<div class="rh"><b>${R.label}</b>${R.desc}</div>`);
    for(const [st,sn] of (PG.sty||STY)){
      const d=document.createElement('div'); d.className='cell'; d.innerHTML=`<div class="rowlab">${R.label} &middot; ${sn}</div>`;
      if(R.kind==="close"){ const row=document.createElement('div'); row.className='cl';
        for(const [k,cap] of R.imgs(st)){ const im=await load(IMG[k]); const f=document.createElement('figure'); const cv=document.createElement('canvas'); cv.width=im.width+4; cv.height=im.height+4;
          const g=cv.getContext('2d'); g.imageSmoothingEnabled=false; bustCard(g,2,2,im.width,im.height,false); g.drawImage(im,2,2); f.appendChild(cv); f.insertAdjacentHTML('beforeend',`<figcaption>${cap}</figcaption>`); row.appendChild(f);
          cells.push({close:true,g,im}); }
        d.appendChild(row); d.insertAdjacentHTML('beforeend',`<div class="cap">closeup ${R.imgs(st).length}&times; 120&times;120 (shown larger than the game uses)</div>`); G.appendChild(d); continue; }
      const cv=document.createElement('canvas'); cv.width=CW; cv.height=CH; d.appendChild(cv);
      const bust=await load(IMG[R.bust(st)]), spr=await load(IMG[R.spr(st)]);
      const big=document.createElement('div'); big.className='big';
      for(const [im,w,h] of [[bust,60,60],[spr,spr.width,spr.height]]){ const b=document.createElement('canvas'); b.width=w; b.height=h; const bg2=b.getContext('2d'); bg2.drawImage(im,0,0); if(im===spr){ b.style.width=(spr.width/60*33)+'%'; b.style.alignSelf='flex-end'; } big.appendChild(b); }
      d.insertAdjacentHTML('beforeend',`<div class="cap">bust 60&times;60 &middot; sprite ${spr.width}&times;${spr.height} px (game size)</div>`); d.appendChild(big);
      G.appendChild(d); const c={g:cv.getContext('2d'),bg,bust,spr,line:R.line,name:R.name?R.name(st):null}; cells.push(c); drawCell(c); } }
  window.__ready=true; })();
function zoom(z){ document.querySelectorAll('.bar button').forEach(b=>b.classList.toggle('on',+b.dataset.z===z));
  document.querySelectorAll('.cell>canvas').forEach(c=>{ c.style.width=z===2?'100%':(CW*z)+'px'; c.style.maxWidth='100%'; });
  document.getElementById('zt').textContent=z===1?'(true pixel size, as small as it gets)':z===3?'(3x, about the desktop game scale)':''; }
document.querySelectorAll('.bar button').forEach(b=>b.onclick=()=>zoom(+b.dataset.z));
let last=0; function tick(now){ if(!S.rm&&now-last>100){ last=now; T=now/1000; cells.forEach(c=>{ if(c.close){ const w=c.im.width,h=c.im.height; c.g.clearRect(0,0,w+4,h+4); bustCard(c.g,2,2,w,h,false); c.g.drawImage(c.im,2,2); } else drawCell(c); }); } requestAnimationFrame(tick); } requestAnimationFrame(tick);
</script></body></html>
