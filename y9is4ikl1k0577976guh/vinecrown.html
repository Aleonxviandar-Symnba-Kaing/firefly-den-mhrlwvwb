function clamp(v,a,b){ return v<a?a:v>b?b:v; }

  const h=rows.length, w=Math.max(...rows.map(r=>r.length));

}

const BAYER=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5];

function ditherFill(g,x0,y0,w,h,stops,opt){
  opt=opt||{}; const cols=stops.map(hex2rgb); const id=g.createImageData(w,h);
  for(let y=0;y<h;y++) for(let x=0;x<w;x++){
    let t;
    if(opt.radial){ const dx=(x-w*(opt.cx||0.5))/(w*0.5), dy=(y-h*(opt.cy||0.5))/(h*0.5); t=clamp(Math.sqrt(dx*dx+dy*dy)/(opt.r||1.2),0,1); }
    else t=clamp((y-(opt.from||0))/((opt.to||h)-(opt.from||0)),0,1);

    const th=(BAYER[(y&3)*4+(x&3)]+0.5)/16; const c=fr>th?cols[i+1]:cols[i];

function makeGlow(r, rgb, a0){
  const sz=r*2+1; const [c,g]=mk(sz,sz); const id=g.createImageData(sz,sz);

  g.putImageData(id,0,0); return c;
}
function disc(p,cx,cy,rx,ry,c){
  for(let y=Math.ceil(cy-ry); y<=Math.floor(cy+ry); y++){
    const dy=(y-cy)/ry; const hw=rx*Math.sqrt(Math.max(0,1-dy*dy));
    const x0=Math.round(cx-hw), x1=Math.round(cx+hw);
    if(x1>=x0) p(x0,y,x1-x0+1,1,c);
  }
}
function tri(p,ax,ay,bx,by,cx_,cy_,c){
  const minx=Math.floor(Math.min(ax,bx,cx_)), maxx=Math.ceil(Math.max(ax,bx,cx_));

  for(let y=miny;y<=maxy;y++){ let run=-1;
    for(let x=minx;x<=maxx+1;x++){

      const a=e(ax,ay,bx,by,px_,py_), b=e(bx,by,cx_,cy_,px_,py_), d=e(cx_,cy_,ax,ay,px_,py_);

    }

}
function line(p,x0,y0,x1,y1,c){
  x0=Math.round(x0); y0=Math.round(y0); x1=Math.round(x1); y1=Math.round(y1);
  const dx=Math.abs(x1-x0), dy=-Math.abs(y1-y0), sx=x0<x1?1:-1, sy=y0<y1?1:-1; let err=dx+dy, n=0;

function wrap(str, maxChars){
  const out=[]; String(str).split("\n").forEach(par=>{
    const words=par.split(" "); let cur="";
    for(const w of words){ if(!cur.length) cur=w; else if((cur+" "+w).length<=maxChars) cur+=" "+w; else { out.push(cur); cur=w; } }
    out.push(cur);
  });
  return out;

function tickMusic(){

  if(schedTo<now) schedTo=now;
  const tr=TRACKS[curTrack]; const spb=60/tr.bpm, L=tr.len*spb;

  for(let k=k0;k<=k0+1;k++){ const base=trT0+k*L;
    for(const n of tr.notes){ const st=base+n[0]*spb;
      if(st>=from && st<to) tone(n[3], midi(n[1]), st, n[2]*spb*(n[5]?1:0.92), n[4], n[5]?{pad:1}:null); } }

}

/* ---- prerendered cave ---- */
const [worldC,wg]=mk(MW*TS,MH*TS);
function buildWorld(){
  const id=wg.createImageData(MW*TS,MH*TS);
  for(let y=0;y<MH*TS;y++) for(let x=0;x<MW*TS;x++){
    const tx=x>>4, ty=y>>4, ch=MAP[ty][tx], k=(y*MW*TS+x)*4;
    const n=hash(x,y), m=hash(x>>2,y>>2);
    let r,g,b;
    const wallish = ch==="#"||ch==="C";
    if(wallish){
      const below=tileCh(tx,ty+1);
      const face = below!=="#" && below!=="C";
      if(face && (y&15)>=4){ // stone face with bricks
        const by=(y&15), bx=((x+((ty&1)*6))%12);
        r=62+m*14; g=42+m*8; b=58+m*10;
        if(by===4||by===10||bx===0){ r-=16; g-=14; b-=16; }
        if(by===5){ r+=10; g+=8; b+=10; }
      } else { r=20+m*8; g=12+m*6; b=24+m*8; if(n>0.93){ r+=14; g+=10; b+=14; } }
    } else {
      r=40+m*12; g=27+m*8; b=24+m*6; const th=(BAYER[(y&3)*4+(x&3)]+0.5)/16; if(hash(x>>3,y>>3)>th+0.35){ r+=8; g+=4; }
      if(n>0.9){ r+=10; g+=8; b+=6; }
      if(hash(tx*3,ty*7)>0.7 && m>0.6){ g+=10; r-=4; }
      const ar=areaAt(tx,ty);
      if(ar==="THE HEART HOLLOW"){ r+=12; g-=4; b-=2; }
      if(ar==="THE RUNE CHAMBER"){ b+=14; g+=4; r-=4; }
      if(ar==="THE HUSHING HALLS"){ r-=8; g-=4; b+=2; }
    }
    id.data[k]=r; id.data[k+1]=g; id.data[k+2]=b; id.data[k+3]=255;
  }
  wg.putImageData(id,0,0);
  const P=painter(wg,0,0,1);
  for(let ty=0;ty<MH;ty++) for(let tx=0;tx<MW;tx++){
    const ch=MAP[ty][tx], x=tx*TS, y=ty*TS;
    if(ch==="#"||ch==="C"){
      const below=tileCh(tx,ty+1);
      if(below!=="#"&&below!=="C"){
        // hanging vines on wall faces
        for(let v=0;v<3;v++){ if(hash(tx*5+v,ty*3)<0.45) continue; const vx=x+2+Math.floor(hash(tx+v*9,ty)*12); const len=6+Math.floor(hash(tx,ty+v)*10);
          for(let i=0;i<len;i++){ P(vx+Math.round(Math.sin(i*0.6+v)*1),y+2+i,1,1,i%3?"#2d5a32":"#3f7a3a"); if(i%4===2) P(vx+1,y+2+i,2,1,"#4f9a48"); } }
        if(ch==="C"){ line(P,x+4,y+5,x+8,y+9,"#0a0610"); line(P,x+8,y+9,x+7,y+14,"#0a0610"); line(P,x+8,y+9,x+12,y+11,"#0a0610"); }
      }
    } else {
      if(hash(tx,ty)>0.8){ const rx=x+3+Math.floor(hash(ty,tx)*9); for(let i=0;i<8;i++) P(rx+i,y+8+Math.round(Math.sin(i)*1.5),1,1,"#3a2a1a"); }
      if(hash(tx+11,ty+3)>0.85) { P(x+5,y+5,2,1,"#4a4040"); P(x+11,y+10,1,1,"#4a4040"); }
      if(hash(tx+2,ty+19)>0.9) { P(x+9,y+3,1,2,"#4f9a48"); P(x+8,y+4,1,1,"#4f9a48"); }
    }
  }
  // pink peonies and leaves tucked against the walls (never in the Hushing Halls)
  for(let ty=1;ty<MH-1;ty++) for(let tx=1;tx<MW-1;tx++){
    if(MAP[ty][tx]!=="." || areaAt(tx,ty)==="THE HUSHING HALLS") continue;
    const nearWall=MAP[ty-1][tx]==="#"||MAP[ty][tx-1]==="#"||MAP[ty][tx+1]==="#";
    if(!nearWall || hash(tx*7,ty*13)<0.72) continue;
    const x=tx*TS+3+Math.floor(hash(tx,ty*5)*8), y=ty*TS+3+Math.floor(hash(ty,tx*3)*6);
    P(x-3,y+3,3,2,"#2d5a32"); P(x+4,y+3,3,2,"#3f7a3a"); P(x,y+5,1,3,"#2d5a32");
    disc(P,x+1,y+1,3,2.5,"#d8587a"); disc(P,x+1,y+1,2,1.6,"#f08aa8"); P(x,y,2,1,"#ffd0e0"); P(x+1,y+2,1,1,"#b03a5a");
  }
  // rune arch on the rune chamber's north wall
  (function(){ const cx=17*TS+8, cy=TS+2;
    for(let a=0;a<=60;a++){ const ang=Math.PI+a/60*Math.PI; const x=cx+Math.cos(ang)*26, y=cy+Math.sin(ang)*14; P(x,y,2,1,"#2a5a88"); P(x,y+1,1,1,"#4a8ab8"); }
    for(let i=0;i<9;i++){ const ang=Math.PI+(i+0.5)/9*Math.PI; P(cx+Math.cos(ang)*22,cy+Math.sin(ang)*10,1,2,"#7fd3ff"); }
    P(cx-27,cy-2,3,6,"#3a2a4a"); P(cx+25,cy-2,3,6,"#3a2a4a"); })();
  // heart hollow roots converge on the heart stone
  for(let i=0;i<14;i++){ const a=i/14*Math.PI*2; let px_=34*TS+8, py_=25*TS+8;
    for(let s=0;s<60;s++){ const nx=px_+Math.cos(a+Math.sin(s*0.2)*0.4)*2, ny=py_+Math.sin(a+Math.sin(s*0.2)*0.4)*2;
      const tx=nx>>4, ty=ny>>4; if(tileCh(tx,ty)==="#") break; P(nx,ny,1,1,s%5?"#3a2416":"#5a3a20"); px_=nx; py_=ny; } }
}

/* ---- scene stage ---- */
const scene={bg:"void", actors:[], flash:0, shake:0};
let SCR=null, DLG=null, MENU=null;
function runScript(steps,onDone){ SCR={steps,i:-1,onDone}; nextStep(); }
function nextStep(){
  if(!SCR) return;
  while(true){
    SCR.i++;
    if(SCR.i>=SCR.steps.length){ const f=SCR.onDone; SCR=null; DLG=null; if(f) f(); return; }
    const s=SCR.steps[SCR.i];
    if(s.when && !s.when()) continue;
    if(s.t==="bg"){ scene.bg=s.bg; if(s.music) playTrack(s.music); continue; }
    if(s.t==="actors"){ scene.actors=s.list.map(a=>Object.assign({},a)); continue; }
    if(s.t==="do"){ s.fn(); if(!SCR) return; continue; }
    if(s.t==="say"||s.t==="card"){
      if(s.who==="hal" && s.form){ const a=scene.actors.find(a=>a.who==="hal"); if(a && a.form!==s.form){ a.form=s.form; scene.flash=0.6; sfx.shift(); } }
      if(s.who==="felix"||s.who==="cub") PORTRAIT_EX[s.who]=s.ex||"neutral";
      DLG={step:s, who:s.who||"none", form:s.form, text:String(s.text).toUpperCase(), shown:0, card:s.t==="card", t:0};
      if(s.t==="say"&&s.who==="hal") DLG.form=s.form||DLG.form||"comfort";
      return;
    }
    if(s.t==="choice"){ if((s.who||"felix")==="felix"||s.who==="cub") PORTRAIT_EX[s.who||"felix"]=s.ex||"neutral"; DLG={who:s.who||"felix", text:String(s.prompt||"").toUpperCase(), shown:999, t:0, choice:true};
      const opts=(typeof s.opts==="function"?s.opts():s.opts).map(o=>typeof o==="string"?{label:o}:o);
      const w=Math.max(150,Math.min(300,8+Math.max(...opts.map(o=>textWidth(o.label)))+20));
      openMenu({title:"", items:opts.map((o,i)=>({label:o.label, disabled:!!o.disabled, fn:()=>{ MENU=null; s.fn(o.v!==undefined?o.v:i); nextStep(); }})), x:VW-w-6, y:Math.max(30,146-opts.length*13-12), w, noBack:true}); return; }
  }
}
function updateDialog(dt){
  if(!DLG) return;
  DLG.t+=dt;
  if(MENU) return;
  const len=DLG.text.length;
  if(DLG.shown<len){
    const before=Math.floor(DLG.shown);
    DLG.shown=Math.min(len, DLG.shown+dt*(DLG.card?38:46));
    const after=Math.floor(DLG.shown);
    if(after>before && after%2===0 && SPK[DLG.who] && SPK[DLG.who].voice){ const v=SPK[DLG.who].voice; sfx.blip(v*(0.9+hash(after,3)*0.25)); }
  }
  if(take("a")||take("b")||tapQ){ tapQ=null;
    if(DLG.shown<len) DLG.shown=len; else nextStep(); }
}
function drawDialog(){
  if(!DLG) return;
  const s=SPK[DLG.who]||SPK.none;
  if(DLG.card){
    const lines=wrap(DLG.text,48); const bh=lines.length*10+16, by=VH-bh-8;
    if(DLG.step&&DLG.step.ex){ PORTRAIT_EX.cub=DLG.step.ex; ctx.globalAlpha=Math.min(1,DLG.t*2.5); bustDraw(ctx,"cub",VW-74,by-64,64,0,time); ctx.globalAlpha=1; }

  } else {
    const bx=4, by=VH-72, bw=VW-8, bh=68;
    ctx.fillStyle="rgba(8,4,14,0.92)"; ctx.fillRect(bx,by,bw,bh);
    ctx.strokeStyle=s.col; ctx.globalAlpha=0.7; ctx.strokeRect(bx+0.5,by+0.5,bw-1,bh-1); ctx.globalAlpha=1;

    if(onStage) pk=null;   // his big stage bust is already showing the expression
    else if(isBust){ // RPG-Maker style: bust stands beside the box
      const talking=DLG.shown<DLG.text.length;
      ctx.fillStyle="rgba(0,0,0,0.35)"; ctx.fillRect(bx+2,by+2,92,bh-4);

      tx=bx+98; wrapN=Math.floor((bw-104)/6); pk=null;
    }
    if(pk){
      ctx.drawImage(portraitBg(pk,54,54),bx+5,by+7);
      ctx.save(); ctx.beginPath(); ctx.rect(bx+5,by+7,54,54); ctx.clip();
      const talking=DLG.shown<DLG.text.length;
      portraitDraw(ctx,pk,bx+8,by+10,48,talking?(Math.floor(time*7)%2):0,time);

      tx=bx+66; wrapN=39;

    const lines=wrap(DLG.text, wrapN);

    if(DLG.shown>=DLG.text.length && !MENU && Math.floor(time*3)%2) drawText(ctx,">",bx+bw-10,by+bh-10,{c:s.col});
  }
}

/* ---- menus ---- */
function openMenu(m){ MENU=Object.assign({sel:0},m); while(MENU.items[MENU.sel]&&MENU.items[MENU.sel].disabled) MENU.sel++; }
function menuRect(m,i){ const ih=13; const top=m.y+(m.title?16:6); return {x:m.x+4,y:top+i*ih,w:m.w-8,h:ih}; }
function updateMenu(){
  const m=MENU; if(!m) return false;
  const n=m.items.length;
  const step=d=>{ let k=m.sel; for(let i=0;i<n;i++){ k=(k+d+n)%n; if(!m.items[k].disabled){ m.sel=k; sfx.move(); return; } } };
  if(take("up")) step(-1); if(take("down")) step(1);
  if(tapQ){ for(let i=0;i<n;i++){ const r=menuRect(m,i); if(tapQ.x>=r.x&&tapQ.x<=r.x+r.w&&tapQ.y>=r.y&&tapQ.y<=r.y+r.h&&!m.items[i].disabled){ m.sel=i; pressed.add("a"); } } tapQ=null; }
  if(take("a")){ const it=m.items[m.sel]; if(it&&!it.disabled){ sfx.select(); it.fn(); } return true; }
  if(take("b")&&!m.noBack){ sfx.move(); if(m.onBack) m.onBack(); else MENU=null; }
  return true;
}
function drawMenu(){
  const m=MENU; if(!m) return;
  const h=(m.title?16:6)+m.items.length*13+6;
  ctx.fillStyle="rgba(8,4,14,0.94)"; ctx.fillRect(m.x,m.y,m.w,h);
  ctx.strokeStyle="#c9a24a"; ctx.strokeRect(m.x+0.5,m.y+0.5,m.w-1,h-1);
  if(m.title) drawText(ctx,m.title,m.x+m.w/2,m.y+5,{c:"#ffd56a",align:"center",shadow:"#000"});
  m.items.forEach((it,i)=>{ const r=menuRect(m,i);
    if(i===m.sel){ ctx.fillStyle="#3a1a40"; ctx.fillRect(r.x,r.y,r.w,r.h-1); drawText(ctx,">",r.x+2,r.y+3,{c:"#ffd56a"}); }
    drawText(ctx,it.label,r.x+10,r.y+3,{c:it.disabled?"#5a4a60":(i===m.sel?"#fff6c8":"#c8b8d8"),shadow:"#000"}); });
}

let blocks=[], jars=[], portals=[], runeProg=[], toast=null, areaName="", areaT=0, grinCharge=true, camX=0, camY=0, caughtT=0, caughtLine="", talkCool=0, darkWarned=false;
let state="title";
function isLanternSafe(px,py,r){ return LANTERNS.some(l=>Math.hypot(px-(l.x*TS+8), py-(l.y*TS+8))<(r||40)); }
function blockAt(tx,ty){ return blocks.find(b=>b.tx===tx&&b.ty===ty); }
function solidTile(tx,ty){
  const ch=tileCh(tx,ty);
  if(SOLID_CH.indexOf(ch)>=0) return true;
  if(ch==="G") return !G.runeSolved;
  if(ch==="H") return !G.platesSolved;
  return false;
}
function solidPx(px,py){ const tx=Math.floor(px/TS), ty=Math.floor(py/TS); return solidTile(tx,ty)||!!blockAt(tx,ty); }
function boxBlocked(x,y){ const hw=5,hh=4; return solidPx(x-hw,y-hh)||solidPx(x+hw,y-hh)||solidPx(x-hw,y)||solidPx(x+hw,y); }
function hushZone(tx,ty){ return (ty>=10&&ty<=20&&tx>=1&&tx<=28)||(tx>=12&&tx<=22&&ty>=1&&ty<=9); }
function hushOK(tx,ty){ return hushZone(tx,ty) && !solidTile(tx,ty) && tileCh(tx,ty)!=="C" && !blockAt(tx,ty) && !isLanternSafe(tx*TS+8,ty*TS+8,40); }
function bfs(sx,sy,gx,gy){
  if(!hushOK(gx,gy)) return null;
  const prev=new Int16Array(MW*MH).fill(-1); const q=[sy*MW+sx]; prev[sy*MW+sx]=sy*MW+sx;
  while(q.length){ const c=q.shift(); const cx=c%MW, cy=(c/MW)|0; if(cx===gx&&cy===gy) break;
    for(const d of [[1,0],[-1,0],[0,1],[0,-1]]){ const nx=cx+d[0], ny=cy+d[1]; if(nx<0||ny<0||nx>=MW||ny>=MH) continue; const k=ny*MW+nx;
      if(prev[k]>=0||!hushOK(nx,ny)) continue; prev[k]=c; q.push(k); } }
  const gk=gy*MW+gx; if(prev[gk]<0) return null;
  const path=[]; let k=gk; while(k!==sy*MW+sx){ path.push([k%MW,(k/MW)|0]); k=prev[k]; } path.reverse(); return path;
}
function los(ax,ay,bx,by){ const d=Math.hypot(bx-ax,by-ay); const n=Math.ceil(d/4); for(let i=1;i<n;i++){ const x=ax+(bx-ax)*i/n, y=ay+(by-ay)*i/n; if(solidPx(x,y)) return false; } return true; }
function showToast(txt,dur){ toast={txt:String(txt).toUpperCase(),t:dur||2.6}; }
function placeHushAt(wpI){ HUSH.wp=wpI; HUSH.x=WAYPOINTS[wpI][0]*TS+8; HUSH.y=WAYPOINTS[wpI][1]*TS+12; HUSH.mode="patrol"; HUSH.path=[]; HUSH.stun=0; }

  portals=SHARDS.filter(s=>G.shards.indexOf(s.id)>=0).map(s=>({x:s.x,y:s.y,id:s.id}));

function nearInteract(){
  const fx=P.x, fy=P.y-4; let best=null, bd=22;
  const consider=(x,y,kind,data)=>{ const d=Math.hypot(fx-x,fy-y); if(d<bd){ bd=d; best={kind,data,x,y}; } };
  for(let ty=Math.floor(fy/TS)-2; ty<=Math.floor(fy/TS)+2; ty++) for(let tx=Math.floor(fx/TS)-2; tx<=Math.floor(fx/TS)+2; tx++){
    const ch=tileCh(tx,ty), cx_=tx*TS+8, cy_=ty*TS+8;
    if(ch==="T") consider(cx_,cy_,"tablet",tx+","+ty);
    if(ch==="L") consider(cx_,cy_,"lantern",LANTERNS.findIndex(l=>l.x===tx&&l.y===ty));
    if(ch==="r") consider(cx_,cy_,"rune",RUNES.findIndex(r=>r.x===tx&&r.y===ty));
    if(ch==="R") consider(cx_,cy_,"reset",null);
    if(ch==="X") consider(cx_,cy_,"heart",null);
    if(ch==="M") consider(cx_,cy_,"marker",null);
  }
  portals.forEach(pt=>consider(pt.x*TS+8,pt.y*TS+8,"portal",pt));
  consider(BRAMBLE_POS.x*TS+8,BRAMBLE_POS.y*TS+8,"bramble",null);
  if(!G.combat) wraiths.forEach(w=>consider(w.x,w.y-6,"wraith",w));
  return best;
}

function interact(it){
  if(it.kind==="tablet"){
    const riddle="FIRST, THE MOON THAT MARKED HIM. THEN, THE FEATHER HE SET FREE. THEN, THE WOLF THAT TURNED AWAY. LAST, THE VINE THAT HOLDS THE KEY.";
    const lines=[N("AN OLD TABLET, WARM UNDER YOUR PAW. CLAW-WORN WORDS:"), N(riddle)];
    if(it.data==="chamber") lines.unshift(N("THE SAME VERSE IS CARVED HERE, BESIDE FOUR RUNE STONES."));
    if(G.attr==="feather") lines.push(F("THE FEATHERS ARE WHISPERING... THE CRACK IN THE NOOK'S EAST WALL ISN'T A WALL."));
    runScript(lines); return; }
  if(it.kind==="lantern"){
    const l=LANTERNS[it.data]; G.light=100; G.hp=maxHp(); G.cp={x:l.x*TS+8,y:(l.y+1)*TS+10}; grinCharge=true; saveGame(); sfx.jar();

  if(it.kind==="rune"){

function updatePlay(dt){
  if(take("menu")){ openPauseMenu(); return; }
  if(take("inv")){ openInventory(); return; }
  if(take("journal")){ openJournal(); return; }
  if(take("b")){ const k=G.inv.indexOf("jar"); if(k>=0 && G.light<99){ G.inv.splice(k,1); G.light=Math.min(100,G.light+45); sfx.jar(); showToast("THE FIREFLIES BRIGHTEN YOUR LANTERN."); } else if(k<0) showToast("NO FIREFLY JARS IN YOUR BAG."); }
  tapQ=null;
  // movement
  let mx=(held("r")?1:0)-(held("l")?1:0), my=(held("d")?1:0)-(held("u")?1:0);
  const sp=(G.attr==="wolf"?60:56);
  if(mx&&my){ mx*=0.7071; my*=0.7071; }
  P.moving=!!(mx||my);
  if(mx) P.face=mx>0?1:-1;
  if(P.moving){ P.anim+=dt; P.still=0; } else P.still+=dt;
  const tryAxis=(dx,dy)=>{ const nx=P.x+dx, ny=P.y+dy; if(!boxBlocked(nx,ny)){ P.x=nx; P.y=ny; return true; } return false; };
  const okX=mx?tryAxis(mx*sp*dt,0):true, okY=my?tryAxis(0,my*sp*dt):true;
  // pushing stone blocks
  let pushing=null;
  if(!okX && !my){ const tx=Math.floor((P.x+mx*7)/TS), ty=Math.floor((P.y-2)/TS); const b=blockAt(tx,ty); if(b && Math.abs(P.y-2-(ty*TS+8))<7) pushing={b,dx:Math.sign(mx),dy:0}; }
  if(!okY && !mx){ const tx=Math.floor(P.x/TS), ty=Math.floor((P.y-2+my*6)/TS); const b=blockAt(tx,ty); if(b && Math.abs(P.x-(tx*TS+8))<7) pushing={b,dx:0,dy:Math.sign(my)}; }
  if(pushing && PLATES.some(pl=>pl.x===pushing.b.tx&&pl.y===pushing.b.ty)) pushing=null; // a stone on a plate stays put
  if(pushing){ P.pushT+=dt; if(P.pushT>0.22){ P.pushT=0; const nx=pushing.b.tx+pushing.dx, ny=pushing.b.ty+pushing.dy;
      if(!solidTile(nx,ny) && !blockAt(nx,ny) && tileCh(nx,ny)!=="h" && tileCh(nx,ny)!=="C"){ pushing.b.tx=nx; pushing.b.ty=ny; sfx.push(); checkPlates(); } } }
  else P.pushT=0;
  blocks.forEach(b=>{ b.px=lerp(b.px,b.tx*TS,Math.min(1,dt*14)); b.py=lerp(b.py,b.ty*TS,Math.min(1,dt*14)); });
  const ptx=Math.floor(P.x/TS), pty=Math.floor((P.y-2)/TS);
  const wasHidden=P.hidden; P.hidden = tileCh(ptx,pty)==="h" && P.still>0.35;
  if(P.hidden&&!wasHidden) sfx.hide();
  // light
  const drain=(G.attr==="wolf"?0.85:1.5);
  G.light=Math.max(0,G.light-drain*dt);
  if(isLanternSafe(P.x,P.y,34)) G.light=Math.min(100,G.light+22*dt);
  if(G.light<=0 && !darkWarned){ darkWarned=true; showToast("TOO DARK... FIND A LANTERN OR USE A JAR (B)."); }
  if(G.light>20) darkWarned=false;
  // pickups
  for(const j of jars.slice()){ const d=Math.hypot(P.x-j.x,P.y-4-j.y); if(d>16) j.ignore=false; if(d<11 && !j.ignore){ tryPickup(j); if(DLG) break; } }
  SHARDS.forEach(s=>{ if(G.shards.indexOf(s.id)>=0) return; if(Math.hypot(P.x-(s.x*TS+8),P.y-4-(s.y*TS+8))<11){ collectShard(s); } });
  if(tileCh(ptx,pty)==="C" && !G.secret){ G.secret=true; saveGame(); showToast("THE CRACKED WALL WAS ONLY VINES AND SHADOW..."); }
  // area names
  const an=areaAt(ptx,pty); if(an && an!==areaName){ areaName=an; areaT=2.6; }
  if(!G.hushSeen && pty>=10 && pty<=20 && ptx<=28){ G.hushSeen=true; HUSH.active=true; placeHushAt(1); HUSH.stun=1.5; saveGame(); sfx.sting(); scene.shake=0.5;
    runScript([N("SOMETHING TALL UNFOLDS AT THE END OF THE HALL. A PALE FACE. NO MOUTH. IT TURNS TOWARD THE SOUND OF YOUR PAWS."),
      F("...OKAY. THAT'S A FACE. THAT'S A LOT OF FACE.","scared"),
      H("dread","THAT IS THE HUSH. IT FOLLOWS LIGHT AND SOUND. IT CANNOT ENTER LANTERN-LIGHT. HIDE STILL IN THE VINES IF IT SEES YOU.")]); }
  if(pty>=20 && ptx>=30 && !G.ch1Done && Math.hypot(P.x-(34*TS+8),P.y-(25*TS+8))<40){ startEnding(); return; }
  if(HUSH.active) updateHush(dt);
  if(state==="play" && !DLG) updateWraiths(dt);
  if(state!=="play" || DLG) return;
  if(chalkT>0) chalkT-=dt;
  if(toast){ toast.t-=dt; if(toast.t<=0) toast=null; }
  if(areaT>0) areaT-=dt;
  // interact
  const it=nearInteract(); P.near=it;
  if(take("a") && it) interact(it);
  // camera
  camX=clamp(Math.round(P.x-VW/2),0,MW*TS-VW); camY=clamp(Math.round(P.y-VH/2-8),0,MH*TS-VH);
}

function updateHush(dt){
  const H_=HUSH; if(H_.stun>0){ H_.stun-=dt; return; }
  const d=Math.hypot(P.x-H_.x,P.y-H_.y);
  const ptx=Math.floor(P.x/TS), pty=Math.floor((P.y-2)/TS);
  const sight=(40+G.light*0.38)*(G.attr==="wolf"?0.8:1)*(H_.mode==="chase"?1.6:1);
  const noiseR=P.moving?(G.attr==="wolf"?20:44):0;
  const canSee=!P.hidden && hushZone(ptx,pty) && !isLanternSafe(P.x,P.y,40) && d<sight && los(H_.x,H_.y-8,P.x,P.y-4);
  if(canSee){ if(H_.mode!=="chase"){ sfx.sting(); H_.path=[]; } H_.mode="chase"; H_.lastSeen=[ptx,pty]; H_.lostT=0; }
  else if(!P.hidden && d<noiseR && hushZone(ptx,pty) && H_.mode!=="chase"){ H_.mode="investigate"; H_.target=[ptx,pty]; H_.path=[]; }
  if(H_.mode==="chase" && !canSee){ H_.lostT+=dt; if(H_.lostT>2.2){ H_.mode="investigate"; H_.target=H_.lastSeen; H_.path=[]; } }
  const htx=Math.floor(H_.x/TS), hty=Math.floor((H_.y-4)/TS);
  H_.repath-=dt;
  let goal=null, speed=26;
  if(H_.mode==="chase"){ goal=[ptx,pty]; speed=43; }
  else if(H_.mode==="investigate"){ goal=H_.target; speed=34; }
  else { goal=WAYPOINTS[H_.wp]; speed=26; }
  if(H_.repath<=0 || !H_.path.length){ H_.repath=0.3; const p=goal?bfs(htx,hty,goal[0],goal[1]):null;
    if(p) H_.path=p; else { H_.path=[]; if(H_.mode!=="patrol"){ H_.mode="patrol"; } else H_.wp=(H_.wp+1)%WAYPOINTS.length; } }
  // move along path; when reaching goal tile, final approach to the player directly
  let tx_, ty_;
  if(H_.path.length){ tx_=H_.path[0][0]*TS+8; ty_=H_.path[0][1]*TS+12; }
  else if(H_.mode==="chase"){ tx_=P.x; ty_=P.y; }
  if(tx_!==undefined){
    const dx=tx_-H_.x, dy=ty_-H_.y, dl=Math.hypot(dx,dy);
    if(dl<2){ if(H_.path.length) H_.path.shift(); }
    else { H_.x+=dx/dl*Math.min(dl,speed*dt); H_.y+=dy/dl*Math.min(dl,speed*dt); }
  }
  if(!H_.path.length){
    if(H_.mode==="patrol"){ H_.wp=(H_.wp+1)%WAYPOINTS.length; }
    else if(H_.mode==="investigate"){ H_.linger+=dt; if(H_.linger>2){ H_.linger=0; H_.mode="patrol"; } }
  }
  if(H_.mode==="chase" || H_.mode==="investigate") playTrack(H_.mode==="chase"?"chase":"cave"); else playTrack("cave");
  if(d<10 && !P.hidden && !isLanternSafe(P.x,P.y,40)) getCaught();
}

/* ---- vine-wraiths: lesser shadows. The Hush stays unbeatable (avoid only). ---- */
let wraiths=[];
function setupWraiths(){ wraiths=WRAITH_HOMES.filter(w=>!G.wraiths[w.id]).map(w=>({id:w.id,hx:w.x*TS+8,hy:w.y*TS+12,x:w.x*TS+8,y:w.y*TS+12,hp:w.hp,max:w.hp,stun:0,ph:hash(w.x,w.y)*6})); }
function wraithMove(w,nx,ny){ const tx=Math.floor(nx/TS), ty=Math.floor((ny-4)/TS); if(solidTile(tx,ty)||isLanternSafe(nx,ny,40)) return; w.x=nx; w.y=ny; }
function updateWraiths(dt){
  for(const w of wraiths){
    if(w.stun>0){ w.stun-=dt; continue; }
    const d=Math.hypot(P.x-w.x,P.y-w.y);
    if(G.combat && d<10 && !P.hidden){ startBattle(w); return; }
    const hunting=G.combat && d>0.5 && d<60 && !P.hidden && !isLanternSafe(P.x,P.y,40) && los(w.x,w.y-6,P.x,P.y-4);
    if(hunting){ const sp=22; wraithMove(w,w.x+(P.x-w.x)/d*sp*dt,w.y+(P.y-w.y)/d*sp*dt); }
    else { const tx=w.hx+Math.cos(time*0.5+w.ph)*14, ty=w.hy+Math.sin(time*0.7+w.ph)*8; const dx=tx-w.x, dy=ty-w.y, dl=Math.hypot(dx,dy)||1; wraithMove(w,w.x+dx/dl*Math.min(dl,14*dt),w.y+dy/dl*Math.min(dl,14*dt)); }
  }
}
function storyWraith(w){
  runScript([N("A VINE-WRAITH SWAYS IN FRONT OF YOU, GREEN EYES BLINKING SLOWLY. IT DOES NOT ATTACK. IT ONLY WATCHES."),
    {t:"choice",who:"felix",prompt:"WHAT DOES FELIX DO?",opts:[{label:"SPARE IT, LET IT PASS",v:"spared"},{label:"DRIVE IT OFF (-20 LIGHT)",v:"banished"}],fn:v=>{
      resolveWraith(w,v); if(v==="banished") G.light=Math.max(0,G.light-20); }},
    {t:"say",who:"none",text:"IT BOWS, OR SOMETHING LIKE IT, AND SLIPS BACK INTO THE VINES. A SPRIG OF MOONMINT IS LEFT BEHIND.",when:()=>G.wraiths[w.id]==="spared"},
    {t:"say",who:"none",text:"FELIX RAISES HIS LANTERN HIGH. THE WRAITH UNRAVELS INTO DRIFTING LEAVES AND IS GONE.",when:()=>G.wraiths[w.id]==="banished"}]);
}
function resolveWraith(w,how){
  G.wraiths[w.id]=how; if(!G.choices.wraith) choose("wraith",how); else saveGame();
  wraiths=wraiths.filter(q=>q!==w);
  if(how==="spared") giveOrDrop("herb"); else giveOrDrop(Math.random()<0.5?"chalk":"ember");
  saveGame();
}

function rnd(a,b){ return a+Math.floor(Math.random()*(b-a+1)); }
function battleMenu(){

  if(P.near && !DLG){ const s=VERB[P.near.kind]; const sx=clamp(P.near.x-camX,30,VW-30), sy=P.near.y-camY-16;
    const w=textWidth("[A] "+s)+6; ctx.fillStyle="rgba(8,4,14,0.85)"; ctx.fillRect(sx-w/2,sy-2,w,11); drawText(ctx,"[A] "+s,sx,sy,{c:"#fff6c8",align:"center"}); }
  if(toast && !DLG){ const w=Math.min(VW-12,textWidth(toast.t?toast.txt:"")+10); const lines=wrap(toast.txt,50);
    ctx.fillStyle="rgba(8,4,14,0.88)"; ctx.fillRect((VW-w)/2,VH-18-lines.length*9,w,lines.length*9+6);
    lines.forEach((ln,i)=>drawText(ctx,ln,VW/2,VH-15-lines.length*9+i*9,{c:"#fbf1dc",align:"center"})); }
}

/* ---- title / pause / settings / end ---- */
let saveData=loadSave();
function openTitleMenu(){
  saveData=loadSave();
  const items=[{label:"NEW GAME",fn:()=>{ newGame(); }}];
  if(saveData&&saveData.attr) items.unshift({label:saveData.ch1Done?"CONTINUE (EXPLORE)":"CONTINUE",fn:()=>{ G=saveData; G.combat=combatPref; MENU=null; beginPlay(false); }});
  items.push({label:"ECHOES JOURNAL",fn:()=>{ MENU=null; openJournal(openTitleMenu); },disabled:!(saveData&&saveData.attr)});
  items.push({label:"MEMORIES",fn:()=>openMemories(openTitleMenu),disabled:!(saveData&&saveData.shards&&saveData.shards.length)});
  items.push({label:"SETTINGS",fn:()=>openSettings(openTitleMenu)});
  items.push({label:"BACK TO THE HUB",fn:()=>{ fadeOutTo("hub.html"); }});
  openMenu({title:"",items,x:96,y:118,w:128,noBack:true});
}
function openSettings(back){
  openMenu({title:"SETTINGS",x:50,y:50,w:220,items:[
    {label:"COMBAT: "+(combatPref?"ON":"OFF (STORY MODE)"),fn:()=>{ setCombat(!combatPref); showToast(combatPref?"COMBAT ENCOUNTERS ON.":"STORY MODE: NO COMBAT."); openSettings(back); }},
    {label:"FULLSCREEN: "+((fsElement()||maxi)?"ON":"OFF")+"  (F)",fn:()=>{ toggleFullscreen(); setTimeout(()=>{ if(MENU&&MENU.title==="SETTINGS") openSettings(back); },150); }},
    {label:"MUSIC: "+(muted?"OFF":"ON")+"  (M)",fn:()=>{ setMuted(!muted); openSettings(back); }},
    {label:"BACK",fn:()=>back()}],onBack:()=>back()});
}
function newGame(){ MENU=null; G=freshState(); try{ localStorage.removeItem(SAVE_KEY); }catch(e){} state="scene"; runScript(SCRIPT_OPEN); }
function openMemories(back){
  const src=(state==="title")?(saveData||G):G;
  openMenu({title:"MEMORIES (ECHO SHARDS)",x:30,y:44,w:260,items:GAME_ORDER.map(id=>{ const got=src.shards&&src.shards.indexOf(id)>=0;
    return {label:got?GAMES[id].name:"??? (UNFOUND SHARD)",disabled:!got,fn:()=>{ if(state!=="title") saveGame(); fadeOutTo(GAMES[id].href); }}; }).concat([{label:"BACK",fn:()=>back()}]),onBack:()=>back()});
}
function openPauseMenu(){
  openMenu({title:"PAUSED",x:80,y:36,w:160,items:[
    {label:"RESUME",fn:()=>{ MENU=null; }},
    {label:"INVENTORY",fn:()=>{ MENU=null; openInventory(); }},
    {label:"ECHOES JOURNAL",fn:()=>{ MENU=null; openJournal(openPauseMenu); }},
    {label:"MEMORIES",fn:()=>openMemories(openPauseMenu),disabled:!G.shards.length},
    {label:"SETTINGS",fn:()=>openSettings(openPauseMenu)},
    {label:"SAVE & BACK TO HUB",fn:()=>{ saveGame(); fadeOutTo("hub.html"); }},
    {label:"TITLE SCREEN",fn:()=>{ saveGame(); MENU=null; toTitle(); }}],onBack:()=>{ MENU=null; }});
}
function openEndMenu(){
  openMenu({title:"",x:84,y:150,w:152,noBack:true,items:[
    {label:"KEEP EXPLORING",fn:()=>{ MENU=null; G.cp={x:34*TS+8,y:18*TS+10}; saveGame(); beginPlay(false); }},
    {label:"ECHOES JOURNAL",fn:()=>{ MENU=null; openJournal(openEndMenu); }},
    {label:"MEMORIES",fn:()=>openMemories(openEndMenu),disabled:!G.shards.length},
    {label:"BACK TO THE HUB",fn:()=>fadeOutTo("hub.html")}]});
}
function toTitle(){ state="title"; SCR=null; DLG=null; INV=null; JOURNAL=false; BT=null; playTrack("void"); openTitleMenu(); }
function drawTitle(){
  bgVoid();
  for(let i=0;i<14;i++){ const a=i/14*Math.PI*2+time*0.1, r=70+((i*13)%30); const x=160+Math.cos(a)*r*1.4, y=80+Math.sin(a)*r*0.6;
    if(((i*7+Math.floor(time*1.2))%9)>2){ ctx.fillStyle="#fffbe8"; ctx.fillRect(x-1|0,y|0,3,1); ctx.fillStyle="#2a1a08"; ctx.fillRect(x|0,y|0,1,1); } }
  ctx.globalCompositeOperation="lighter"; ctx.drawImage(GLOW_BLUE,160-26,46-26); ctx.globalCompositeOperation="source-over";
  portraitDraw(ctx,"hal_uncanny",128,14,64,0,time);
  drawText(ctx,"VINECROWN",VW/2,82,{s:3,c:"#ffd56a",align:"center",shadow:"#7a2010"});
  drawText(ctx,"THE HOLLOW BENEATH",VW/2,106,{c:"#f0b8c8",align:"center",shadow:"#000"});
  if(!MENU) openTitleMenu();
  drawText(ctx,"CHAPTER ONE: I'LL BE THE MYSTERY",VW/2,VH-9,{c:"#8a6a8a",align:"center"});
}
function drawEnd(){
  bgVoid();
  ctx.fillStyle="rgba(0,0,0,0.5)"; ctx.fillRect(0,0,VW,VH);
  drawText(ctx,"TO BE CONTINUED",VW/2,10,{s:2,c:"#ff5a6a",align:"center",shadow:"#300010"});
  drawText(ctx,"END OF CHAPTER ONE - ECHO SHARDS "+G.shards.length+"/5",VW/2,30,{c:"#c8b8e8",align:"center"});
  let y=44; echoLines().forEach(l=>wrap(l,50).forEach(ln=>{ if(y<142){ drawText(ctx,ln,12,y,{c:"#e8dcc8"}); y+=9; } }));
  drawText(ctx,"FELIX WILL CARRY THESE INTO CHAPTER TWO.",VW/2,VH-8,{c:"#6a5a7a",align:"center"});
}

/* ---- main loop ---- */
let lastTs=0;
function frame(ts){
  const dt=Math.min(0.05, lastTs?(ts-lastTs)/1000:0.016); lastTs=ts; time+=dt;
  tickMusic();
  if(scene.flash>0) scene.flash=Math.max(0,scene.flash-dt*1.5);
  if(scene.shake>0) scene.shake=Math.max(0,scene.shake-dt);
  if(fadeT>0){ fadeT+=dt; if(fadeT>0.7 && fadeHref){ const h=fadeHref; fadeHref=null; window.location.href=h; } }
  else if(MENU) updateMenu();
  else if(JOURNAL) updateJournal();
  else if(INV) updateInventory();
  else if(DLG) updateDialog(dt);
  else if(state==="battle") updateBattle(dt);
  else if(state==="select") updateSelect();
  else if(state==="play") updatePlay(dt);
  else if(state==="caught"){ caughtT+=dt; if(caughtT>4.2||(caughtT>1.6&&(take("a")||tapQ))){ tapQ=null; respawn(); } }
  else if(state==="title"){ if(!MENU) openTitleMenu(); }
  pressed.clear(); tapQ=null;
  ctx.save();
  if(scene.shake>0) ctx.translate(Math.round((Math.random()-0.5)*4*scene.shake),Math.round((Math.random()-0.5)*4*scene.shake));
  if(state==="title") drawTitle();
  else if(state==="select") drawSelect();
  else if(state==="end") drawEnd();
  else if(state==="battle") drawBattle();
  else if(state==="play"||state==="caught"){ drawWorld(); drawHUD();
    if(state==="caught"){ const a=clamp(caughtT/0.8,0,1); ctx.fillStyle="rgba(0,0,0,"+a+")"; ctx.fillRect(-4,-4,VW+8,VH+8);
      if(caughtT>0.9){ ctx.globalAlpha=clamp((caughtT-0.9)*2,0,1); wrap(caughtLine,40).forEach((ln,i)=>drawText(ctx,ln,VW/2,96+i*11,{c:"#c8c0d8",align:"center"})); ctx.globalAlpha=1; } } }
  else if(state==="scene"){ if(DLG&&DLG.card) drawCardArt(DLG.step.art); else { drawSceneBg(scene.bg); drawStage(); } }
  if(scene.flash>0){ ctx.globalAlpha=scene.flash*0.6; ctx.fillStyle="#fff8e0"; ctx.fillRect(-4,-4,VW+8,VH+8); ctx.globalAlpha=1; }
  ctx.restore();
  drawDialog();
  if(INV) drawInventory();
  if(JOURNAL) drawJournal();
  drawMenu();
  if(fadeT>0){ ctx.fillStyle="rgba(0,0,0,"+clamp(fadeT/0.6,0,1)+")"; ctx.fillRect(0,0,VW,VH); }
  requestAnimationFrame(frame);
}
function fit(){
  const vv=window.visualViewport; const sw=(vv&&vv.width)?vv.width:window.innerWidth, sh=(vv&&vv.height)?vv.height:window.innerHeight;
  const full=!!fsElement()||maxi;
  const portraitTouch=touchy && sh>sw; let s=Math.min(sw/VW, (portraitTouch?sh-190:sh)/VH);
  if(s>1 && !full){ const is=Math.floor(s); if(s-is<0.12) s=is; } s=Math.max(s,0.5);
  cv.style.width=Math.round(VW*s)+"px"; cv.style.height=Math.round(VH*s)+"px";
}
window.addEventListener("resize",fit); if(window.visualViewport) window.visualViewport.addEventListener("resize",fit);
fit(); cv.focus(); playTrack("void");
window.__vc={art:{portraitBg,portraitDraw,felixR,felixL,cubSpr,bustDraw,PORTRAIT_EX,BUST_EX}, get state(){return state;}, get G(){return G;}, P, HUSH, get DLG(){return DLG;}, get MENU(){return MENU;}, get blocks(){return blocks;}, runeProg:()=>runeProg,
  toggleFullscreen, isFull:()=>!!fsElement()||maxi, get BT(){return BT;}, get INV(){return INV;}, get JOURNAL(){return JOURNAL;}, get wraiths(){return wraiths;}, get items(){return jars;},
  invCap, maxHp, echoLines:()=>echoLines(), setCombat, startBattle:(i)=>startBattle(wraiths[i||0]), get combatPref(){return combatPref;}};
requestAnimationFrame(frame);
})();
