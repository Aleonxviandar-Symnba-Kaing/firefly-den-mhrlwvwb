<script>
'use strict';
// =====================================================================
//  LEON: THE COLOSSEUM  -  you cannot die here. not yet.
//  All art procedural, all audio synthesized. No external assets.
// =====================================================================
const W=256, H=144;
const cv=document.getElementById('c');
const ctx=cv.getContext('2d');
ctx.imageSmoothingEnabled=false;
function resize(){
  const rot=document.getElementById('rot');
  const vw=window.innerWidth, vh=window.innerHeight-(rot&&rot.offsetParent?40:0);
  const dpr=window.devicePixelRatio||1;
  let s=Math.min(vw/W,vh/H);
  let dp=Math.floor(s*dpr); if(dp<1) dp=1;
  s=dp/dpr;
  if(W*s>vw+0.5||H*s>vh+0.5) s=Math.min(vw/W,vh/H);
  cv.style.width=(W*s)+'px'; cv.style.height=(H*s)+'px';
}
window.addEventListener('resize',resize);
window.addEventListener('orientationchange',()=>setTimeout(resize,250));
resize();

const R=Math.random; // cosmetic randomness only
// real dice: crypto-backed, rejection-sampled (no modulo bias)
function rint(n){
  try{
    if(window.crypto&&crypto.getRandomValues){
      const a=new Uint32Array(1), lim=Math.floor(4294967296/n)*n; let v;
      do{ crypto.getRandomValues(a); v=a[0]; }while(v>=lim);
      return v%n+1;
    }
  }catch(e){}
  return 1+Math.floor(Math.random()*n);
}
const pick=a=>a[Math.floor(R()*a.length)];
const BAYER=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5];
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const mod=(a,n)=>((a%n)+n)%n;
const hsh=n=>{const s=Math.sin(n*12.9898+78.233)*43758.5453;return s-Math.floor(s);};
const ease=t=>t*t*(3-2*t);
const eout=t=>1-(1-t)*(1-t);
function mk(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');g.imageSmoothingEnabled=false;return [c,g];}
function hexRgb(h){h=h.replace('#','');return [parseInt(h.substr(0,2),16),parseInt(h.substr(2,2),16),parseInt(h.substr(4,2),16)];}
function rgbHex(r,g,b){return '#'+[r,g,b].map(v=>{v=clamp(Math.round(v),0,255);return (v<16?'0':'')+v.toString(16);}).join('');}
function dith(x,y){return (BAYER[(mod(y,4))*4+mod(x,4)]+0.5)/16;}

// ---------- 3x5 pixel font ----------
const FONT={
A:[2,5,7,5,5],B:[6,5,6,5,6],C:[3,4,4,4,3],D:[6,5,5,5,6],E:[7,4,6,4,7],F:[7,4,6,4,4],G:[3,4,5,5,3],
H:[5,5,7,5,5],I:[7,2,2,2,7],J:[1,1,1,5,2],K:[5,5,6,5,5],L:[4,4,4,4,7],M:[5,7,5,5,5],N:[6,5,5,5,5],
O:[2,5,5,5,2],P:[6,5,6,4,4],Q:[2,5,5,6,3],R:[6,5,6,5,5],S:[3,4,2,1,6],T:[7,2,2,2,2],U:[5,5,5,5,7],
V:[5,5,5,5,2],W:[5,5,5,7,7],X:[5,5,2,5,5],Y:[5,5,2,2,2],Z:[7,1,2,4,7],
'0':[7,5,5,5,7],'1':[2,6,2,2,7],'2':[6,1,2,4,7],'3':[6,1,2,1,6],'4':[5,5,7,1,1],'5':[7,4,6,1,6],
'6':[3,4,6,5,2],'7':[7,1,2,2,2],'8':[2,5,2,5,2],'9':[2,5,3,1,6],
'!':[2,2,2,0,2],"'":[2,2,0,0,0],'.':[0,0,0,0,2],',':[0,0,0,2,4],':':[0,2,0,2,0],'-':[0,0,7,0,0],
'/':[1,1,2,4,4],'?':[6,1,2,0,2],'(':[1,2,2,2,1],')':[4,2,2,2,4],'+':[0,2,7,2,0],'&':[2,5,2,5,3],
'<':[1,2,4,2,1],'>':[4,2,1,2,4],'^':[2,5,0,0,0],'*':[0,5,2,5,0],' ':[0,0,0,0,0],'~':[0,3,6,0,0],
'#':[5,7,5,7,5],'|':[2,2,2,2,2],'_':[0,0,0,0,7],'=':[0,7,0,7,0],'%':[5,1,2,4,5],'[':[3,2,2,2,3],
']':[6,2,2,2,6],'"':[5,5,0,0,0],';':[0,2,0,2,4]
};
function textW(s,sc){sc=sc||1;return s.length*4*sc-sc;}
function rawText(s,x,y,sc,col,jit){
  ctx.fillStyle=col;
  for(let i=0;i<s.length;i++){
    const g=FONT[s[i]]||FONT['?'];
    const oy=jit?jit(i):0;
    for(let r=0;r<5;r++){
      const b=g[r]; if(!b) continue;
      for(let c=0;c<3;c++) if(b&(4>>c)) ctx.fillRect(x+i*4*sc+c*sc,y+oy+r*sc,sc,sc);
    }
  }
}
// o: {s, c, align, outline, shadow, jit(i)->dy, crack}
function drawText(str,x,y,o){
  o=o||{}; const s=String(str).toUpperCase(); const sc=o.s||1;
  const w=textW(s,sc);
  if(o.align==='center') x-=Math.floor(w/2); else if(o.align==='right') x-=w;
  x=Math.round(x); y=Math.round(y);
  if(o.outline){ for(let dx=-1;dx<=1;dx++)for(let dy=-1;dy<=1;dy++) if(dx||dy) rawText(s,x+dx,y+dy,sc,o.outline,o.jit); }
  if(o.shadow){ rawText(s,x+sc,y+sc,sc,o.shadow,o.jit); }
  rawText(s,x,y,sc,o.c||'#fff',o.jit);
  if(o.crack){ // dark fractures through the glyphs (stable per string)
    ctx.fillStyle=o.crackC||'#2a0008';
    let seed=0; for(let i=0;i<s.length;i++) seed+=s.charCodeAt(i)*(i+1);
    const n=Math.max(1,Math.floor(s.length/5));
    for(let k=0;k<n;k++){
      let cx=x+Math.floor(hsh(seed+k*3.1)*w), cy=y;
      const dir=hsh(seed+k*7.7)<0.5?-1:1;
      for(let j=0;j<5*sc;j++){ ctx.fillRect(cx,cy+j,1,1); if(hsh(seed+k+j*1.3)<0.45) cx+=dir; }
    }
  }
  return w;
}
const GLCH='?#!/*~<>0123456789_%';
function glitch(s,amt,seed){
  if(amt<=0) return s; const a=s.split('');
  for(let i=0;i<a.length;i++){
    if(a[i]===' ') continue; const h=hsh(seed*7.31+i*1.79);
    if(h<amt) a[i]=GLCH[(hsh(seed*3.7+i)*GLCH.length)|0];
  }
  return a.join('');
}
// pixel-exact primitives on the main canvas
function fillPoly(pts,col){
  ctx.fillStyle=col; let y0=1e9,y1=-1e9;
  for(const p of pts){y0=Math.min(y0,p[1]);y1=Math.max(y1,p[1]);}
  for(let y=Math.floor(y0);y<=Math.ceil(y1);y++){
    const yc=y+0.5,xs=[];
    for(let i=0;i<pts.length;i++){const a=pts[i],b=pts[(i+1)%pts.length];
      if((a[1]<=yc&&b[1]>yc)||(b[1]<=yc&&a[1]>yc)) xs.push(a[0]+(yc-a[1])/(b[1]-a[1])*(b[0]-a[0]));}
    xs.sort((p,q)=>p-q);
    for(let k=0;k+1<xs.length;k+=2){const xa=Math.round(xs[k]),xb=Math.round(xs[k+1]);if(xb>xa)ctx.fillRect(xa,y,xb-xa,1);}
  }
}
function pline(x0,y0,x1,y1,col,w){
  ctx.fillStyle=col; w=w||1;
  const n=Math.max(1,Math.ceil(Math.max(Math.abs(x1-x0),Math.abs(y1-y0))));
  for(let i=0;i<=n;i++) ctx.fillRect(Math.round(x0+(x1-x0)*i/n-(w-1)/2),Math.round(y0+(y1-y0)*i/n-(w-1)/2),w,w);
}
function prect(x,y,w,h,col){ctx.fillStyle=col;ctx.fillRect(Math.round(x),Math.round(y),w,h);}
// ---------- glows (stepped, additive) ----------
function makeGlow(r,rgb,a0,steps){
  steps=steps||4; const s=r*2+1; const [c,g]=mk(s,s); const id=g.createImageData(s,s);
  for(let j=0;j<s;j++)for(let i=0;i<s;i++){
    const d=Math.hypot(i-r,j-r)/(r+0.5); if(d>1)continue;
    let a=Math.ceil((1-d)*steps)/steps; a=a*a*a0;
    const k=(j*s+i)*4; id.data[k]=rgb[0];id.data[k+1]=rgb[1];id.data[k+2]=rgb[2];id.data[k+3]=Math.round(a*255);
  }
  g.putImageData(id,0,0); return c;
}
const glowCache=new Map();
function glowAdd(r,rgb,a0,x,y,a){
  r=Math.max(1,Math.round(r)); const key=r+'|'+rgb.join(',')+'|'+a0;
  let gc=glowCache.get(key); if(!gc){gc=makeGlow(r,rgb,a0);glowCache.set(key,gc);}
  if(a<=0.01) return;
  ctx.globalCompositeOperation='lighter'; ctx.globalAlpha=clamp(a,0,1);
  ctx.drawImage(gc,Math.round(x)-r,Math.round(y)-r);
  ctx.globalAlpha=1; ctx.globalCompositeOperation='source-over';
}
// =====================================================================
//  SPRITES  (built in code on a pixel grid, then baked to canvases)
// =====================================================================
class Grid{
  constructor(w,h){this.w=w;this.h=h;this.d=new Array(w*h).fill(null);}
  set(x,y,c){x=Math.round(x);y=Math.round(y);if(x<0||y<0||x>=this.w||y>=this.h)return;this.d[y*this.w+x]=c;}
  get(x,y){x=Math.round(x);y=Math.round(y);if(x<0||y<0||x>=this.w||y>=this.h)return null;return this.d[y*this.w+x];}
  rect(x,y,w,h,c){for(let j=0;j<h;j++)for(let i=0;i<w;i++)this.set(x+i,y+j,c);}
  ell(cx,cy,rx,ry,c,sh,hi){
    for(let y=Math.floor(cy-ry);y<=Math.ceil(cy+ry);y++)for(let x=Math.floor(cx-rx);x<=Math.ceil(cx+rx);x++){
      const dx=(x-cx)/rx,dy=(y-cy)/ry; if(dx*dx+dy*dy>1) continue;
      let col=c; if(sh&&dy>0.42) col=sh; else if(hi&&dy<-0.45&&dx<0.35) col=hi;
      this.set(x,y,col);
    }
  }
  line(x0,y0,x1,y1,c,w){
    w=w||1; const n=Math.max(1,Math.ceil(Math.max(Math.abs(x1-x0),Math.abs(y1-y0))));
    for(let i=0;i<=n;i++){const x=x0+(x1-x0)*i/n,y=y0+(y1-y0)*i/n;
      if(w===1) this.set(x,y,c); else this.rect(Math.round(x-(w-1)/2),Math.round(y-(w-1)/2),w,w,c);}
  }
  path(p,c,w){for(let i=0;i<p.length-1;i++)this.line(p[i][0],p[i][1],p[i+1][0],p[i+1][1],c,w);}
  poly(pts,c){
    let y0=1e9,y1=-1e9; pts.forEach(p=>{y0=Math.min(y0,p[1]);y1=Math.max(y1,p[1]);});
    for(let y=Math.floor(y0);y<=Math.ceil(y1);y++){
      const yc=y+0.5,xs=[];
      for(let i=0;i<pts.length;i++){const a=pts[i],b=pts[(i+1)%pts.length];
        if((a[1]<=yc&&b[1]>yc)||(b[1]<=yc&&a[1]>yc)) xs.push(a[0]+(yc-a[1])/(b[1]-a[1])*(b[0]-a[0]));}
      xs.sort((p,q)=>p-q);
      for(let k=0;k+1<xs.length;k+=2) for(let x=Math.round(xs[k]);x<Math.round(xs[k+1]);x++) this.set(x,y,c);
    }
  }
  map(fn){const g=new Grid(this.w,this.h);for(let i=0;i<this.d.length;i++)g.d[i]=this.d[i]?fn(this.d[i]):null;return g;}
  scaled(s){const nw=Math.round(this.w*s),nh=Math.round(this.h*s);const g=new Grid(nw,nh);
    for(let y=0;y<nh;y++)for(let x=0;x<nw;x++)g.d[y*nw+x]=this.d[Math.min(this.h-1,Math.floor(y/s))*this.w+Math.min(this.w-1,Math.floor(x/s))];return g;}
  canvas(outline){
    const [c,g]=mk(this.w+2,this.h+2);
    if(outline){ g.fillStyle=outline;
      for(let y=-1;y<=this.h;y++)for(let x=-1;x<=this.w;x++){
        if(this.get(x,y))continue;
        if(this.get(x-1,y)||this.get(x+1,y)||this.get(x,y-1)||this.get(x,y+1)) g.fillRect(x+1,y+1,1,1);
      } }
    for(let y=0;y<this.h;y++)for(let x=0;x<this.w;x++){const v=this.d[y*this.w+x];if(v){g.fillStyle=v;g.fillRect(x+1,y+1,1,1);}}
    return c;
  }
}
function mixCol(a,b,t){const A=hexRgb(a),B=hexRgb(b);return rgbHex(lerp(A[0],B[0],t),lerp(A[1],B[1],t),lerp(A[2],B[2],t));}
function tintCol(hex,k){ // "Fiercer": darker, bloodier
  let [r,g,b]=hexRgb(hex); const l=0.3*r+0.59*g+0.11*b;
  r=lerp(r,l,0.3*k); g=lerp(g,l,0.3*k); b=lerp(b,l,0.3*k);
  r=r*(1-0.32*k)+30*k; g=g*(1-0.55*k); b=b*(1-0.42*k)+14*k;
  return rgbHex(r,g,b);
}
const OUTL='#07040a';

// ---------------- LEON (faces right) ----------------
const LP={G:'#e2a83a',g:'#b07824',d:'#7c4e1a',L:'#f6d488',R:'#b4402a',r:'#7a2620',q:'#4e1618',m:'#dc6a3e',
  N:'#2e140e',k:'#3e2414',K:'#e8dcc8',v:'#17331f',V:'#2c5232',t:'#a8bc8c',E:'#ff5a1e',e:'#9a2210',P:'#a45cff',p:'#4e2a8a'};
function leonGrid(pose){
  const g=new Grid(44,32);
  const down=pose==='down', brace=pose==='brace';
  const by=down?6:(brace?2:0);
  const hy=down?10:(brace?3:(pose==='idle1'?1:0));
  const legLen=down?0:(brace?6:8);
  const ly=23+by;
  // tail
  if(!down){ g.path([[7,18+by],[4,15+by],[2,11+by],[3,8+by]],LP.g); g.ell(3,7+by,1.6,2,LP.R,LP.r); }
  else { g.path([[7,25],[4,27],[1,28]],LP.g); g.ell(1,28,1.5,1.5,LP.R); }
  // far legs
  if(legLen){ g.rect(9,ly,3,legLen,LP.d); g.rect(23,ly,3,legLen,LP.d); g.rect(9,ly+legLen-1,4,1,LP.k); g.rect(23,ly+legLen-1,4,1,LP.k); }
  // body + haunch
  g.ell(17,19+by,11,5.5,LP.G,LP.g,LP.L);
  g.ell(10,18+by,5,5,LP.G,LP.g,LP.L);
  for(let x=9;x<=26;x++) if(g.get(x,24+by)) g.set(x,24+by,LP.g);
  // vines winding round the body, thorns pale-tipped
  for(let x=5;x<=27;x++){ const y=Math.round(19+by+Math.sin(x*0.5+0.4)*4.6);
    if(g.get(x,y)){ g.set(x,y,LP.v); if(x%3===0&&g.get(x,y-1)) g.set(x,y-1,LP.t); else if(x%3===1&&g.get(x,y+1)) g.set(x,y+1,LP.V);} }
  for(let x=7;x<=26;x++){ const y=Math.round(18+by+Math.sin(x*0.5+3.5)*4);
    if(g.get(x,y)){ g.set(x,y,LP.V); if(x%4===2&&g.get(x,y+1)) g.set(x,y+1,LP.t);} }
  // near legs
  if(legLen){
    [12,26].forEach(lx=>{ g.rect(lx,ly,3,legLen,LP.G); for(let k=0;k<legLen;k++) g.set(lx,ly+k,LP.g);
      g.rect(lx,ly+legLen-1,4,1,LP.k); g.set(lx+3,ly+legLen-1,LP.K); });
    for(let k=0;k<legLen-1;k++) g.set(26+((k>>1)%2?2:0)+(k%2),ly+k,(k%3===2)?LP.t:LP.v);
    for(let k=1;k<legLen-1;k+=2) g.set(12+(k%4===1?2:0),ly+k,LP.v);
  }
  // mane (full, flowing, auburn-red)
  const mx=30,my=12+hy;
  for(let y=my-12;y<=my+15;y++)for(let x=mx-13;x<=mx+11;x++){
    const dx=x-mx, dy=(y-my)*0.92; const a=Math.atan2(dy,dx), d=Math.hypot(dx,dy);
    let rr=9.2+1.4*Math.sin(a*7+0.6)+0.8*Math.sin(a*13+2.1);
    if(dy>0&&dx<3) rr+=Math.min(dy,7)*0.3;
    if(d>rr) continue;
    let c=LP.R;
    if(d>rr-1.6) c=((x*3+y)%4===0)?LP.q:LP.r;
    else if(dy>5||dx<-6) c=LP.r;
    if(c===LP.R&&((x+y*2)%5===0)&&dy<3) c=LP.m;
    g.set(x,y,c);
  }
  // vine through the mane at the throat
  for(let k=0;k<7;k++) g.set(22+k,19+hy+(k%2),LP.v); g.set(24,18+hy,LP.t); g.set(27,21+hy,LP.t);
  // ears
  g.ell(25,3+hy,1.6,1.6,LP.G); g.set(25,3+hy,LP.r); g.ell(35,3+hy,1.6,1.6,LP.G); g.set(35,3+hy,LP.r);
  // face
  g.ell(32,12+hy,4.6,5.2,LP.G,LP.g,LP.L);
  g.ell(34.5,15+hy,3,2.1,LP.L);
  g.rect(36,13+hy,2,1,LP.N); g.set(37,14+hy,LP.N);
  g.set(36,15+hy,LP.N); g.set(35,16+hy,LP.N); g.set(37,16+hy,LP.N);
  g.rect(32,18+hy,3,1,LP.g);
  g.rect(29,10+hy,2,1,LP.d); g.rect(33,10+hy,2,1,LP.d);
  if(down||pose==='blink'){ g.rect(29,11+hy,2,1,LP.N); g.rect(33,11+hy,2,1,LP.N); }
  else { g.rect(29,11+hy,2,1,LP.E); g.set(30,12+hy,LP.e); g.set(29,12+hy,LP.E);
         g.rect(33,11+hy,2,1,LP.P); g.set(33,12+hy,LP.p); g.set(34,12+hy,LP.P); }
  return g;
}
const LEON={};
['idle0','idle1','brace','down','blink'].forEach(p=>{
  const g=leonGrid(p);
  LEON[p]=g.canvas(OUTL);
  LEON[p+'_hurt']=g.map(c=>mixCol(c,'#ff2040',0.55)).canvas('#3a0010');
  LEON[p+'_sil']=g.map(()=>'#000000').canvas('#000000');
});
// Leon's eye pixel positions in canvas space (+1 pad) for glints
const LEON_EYES=[[30,12,[255,90,30]],[34,12,[170,90,255]]];

// ---------------- THE SEVEN SOULS (face left) ----------------
function gGazelle(){
  const g=new Grid(46,44), C={b:'#a8988a',s:'#6e5e58',h:'#c8baa8',d:'#3a2e2e',k:'#1e1618',e:'#f0f4ff',x:'#4a3a3a',p:'#d8ccbc'};
  g.path([[30,18],[33,12],[37,9],[40,4]],C.s); g.set(40,3,C.k); g.set(41,3,C.k);
  g.path([[24,17],[23,11],[27,7]],C.s); g.set(28,7,C.k);
  const lx=[14,16,18,21,23,26,28,31,33];
  lx.forEach((x,i)=>{ const knee=31+((i*7)%5), kx=x+((i%2)?2:-2), fx=x+((i%3)-1);
    g.path([[x,23],[kx,knee],[fx,43]], i%2?C.s:C.b); g.set(fx,43,C.k); g.set(fx-1,43,C.k); });

function update(dt){

  goldFlick=Math.max(0,goldFlick-dt); eyeFlare=Math.max(0,eyeFlare-dt*0.55); msg.t+=dt;
  for(let i=0;i<4;i++) pressT[i]=Math.max(0,pressT[i]-dt);

  const e=enemy;

    e.hurtT=Math.max(0,e.hurtT-dt);
    if(e.lungeT>0){ e.lungeT+=dt; if(e.lungeT>0.42) e.lungeT=0; }
    if(e.dead) e.deathT+=dt;
    if(e.idx===1&&!e.dead&&e.rise>=1){ e.dripT+=dt; if(e.dripT>0.3){ e.dripT=0; const p=enemyPos(e);
      parts.push({x:p.x+p.w*(0.3+R()*0.45),y:p.y+p.h*0.7,vx:0,vy:4,t:0,life:0.9,c:'#141018',g:70,h:2}); } }
  }
  for(const d of dice){

    if(!d.settled){

    }

  dice=dice.filter(d=>!(d.settled&&d.life>3.2));
  pops.forEach(p=>p.t+=dt); pops=pops.filter(p=>p.t<1.3);
  parts.forEach(p=>{p.t+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=p.g*dt; if(p.y>FEET+3&&p.g>0&&p.vy>0){p.vy*=-0.2;p.vx*=0.5;p.y=FEET+3;}}); parts=parts.filter(p=>p.t<p.life);
  wisps.forEach(w=>{ w.t+=dt; const p=clamp(w.t/w.dur,0,1), q=ease(p); const cx=(w.sx+w.tx)/2, cy=Math.min(w.sy,w.ty)-34;
    w.x=(1-q)*(1-q)*w.sx+2*(1-q)*q*cx+q*q*w.tx+Math.sin(w.t*14)*2*(1-p); w.y=(1-q)*(1-q)*w.sy+2*(1-q)*q*cy+q*q*w.ty;

  if(shriek){ shriek.t+=dt; if(shriek.t>shriek.dur) shriek=null; }

  for(const h of HOLES){ const tg=h.ord<N?1:0; h.o+=(tg-h.o)*Math.min(1,dt*(tg?2.2:4)); }
  G&&G.items.forEach(it=>{ if(it.rot) it.rot+=dt; if(it.newT) it.newT=Math.max(0,it.newT-dt); });
  if(state==='fight'&&!busy&&menu==='main'){ idleT+=dt; if(idleT>15){ idleT=-R()*8; doTaunt(); } }

}

  if(inRect(p,MUTE_R)){ toggleMute(); return; }
  if(advance()) return;
  if(state!=='fight') return;
  const i=btnAt(p);
  if(i>=0){ focus=i; act(i); return; }
  if(menu==='main'&&!busy) for(let k=0;k<3;k++) if(G.items[k]&&inRect(p,{x:slotX(k),y:125,w:19,h:16})){ menu='items'; act(k); return; }
},{passive:false});
cv.addEventListener('pointermove',e=>{ if(e.pointerType!=='mouse'||state!=='fight') return; const i=btnAt(toInternal(e)); if(i>=0&&i!==hover){ hover=i; focus=i; } if(i<0) hover=-1; });
cv.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
window.addEventListener('keydown',e=>{
  const k=(e.key||'').toLowerCase();
  if([' ','spacebar','enter','arrowleft','arrowright','arrowup','arrowdown','backspace'].includes(k)||e.code==='Space') e.preventDefault();
  if(['shift','control','alt','meta','tab','capslock'].includes(k)) return;
  initAudio();
  if(k==='m'){ toggleMute(); return; }
  if(e.repeat) return;
  const go=k==='enter'||k===' '||k==='spacebar'||e.code==='Space';
  if(state!=='fight'){ if(go||'123abi'.includes(k)&&k.length===1||k==='escape') advance(); return; }
  if(k==='arrowleft'||k==='arrowup'){ focus=mod(focus-1,nBtns()); return; }
  if(k==='arrowright'||k==='arrowdown'){ focus=mod(focus+1,nBtns()); return; }
  if(go){ act(focus); return; }
  if(menu==='main'){ if(k==='1'||k==='a') act(0); else if(k==='2'||k==='b') act(1); else if(k==='3'||k==='i') act(2); }
  else if(menu==='items'){ if(k==='1') act(0); else if(k==='2') act(1); else if(k==='3') act(2); else if(k==='escape'||k==='backspace'||k==='i'||k==='b') act(3); }
  else if(menu==='reroll'){ if(k==='1'||k==='a'||k==='r'||k==='y'||k==='i') act(0); else if(k==='2'||k==='b'||k==='n'||k==='escape') act(1); }
});

// =====================================================================
//  LOOP + DEBUG PARAMS (?wave=N  ?will=N  ?end=1)
// =====================================================================
let lastT=performance.now();
function frame(t){
  let dt=(t-lastT)/1000; lastT=t; if(dt>0.05) dt=0.05; if(dt<0) dt=0;
  try{ update(dt); render(); }catch(err){ console.error(err); }
  requestAnimationFrame(frame);
}
(function(){
  if(Q.get('end')){
    G={will:0,maxWill:30,wave:5,startWave:1,kills:4,nat20:1,found:2,rotted:1,items:[],feather:0,braced:false,wisps:4};
    enemy=null; state='ending'; endT=0; endFlags={}; wantMusic='end'; finishStats(true);
  } else if(Q.has('wave')||Q.has('will')) newGame();
  else { state='title'; wantMusic='title'; }
})();
requestAnimationFrame(frame);
// test hook
window.__colosseum={get state(){return state;},get G(){return G;},get busy(){return busy;},get menu(){return menu;},get enemy(){return enemy;},
  get dice(){return dice;},get endT(){return endT;},get wisps(){return wisps;},get taunt(){return taunt;},get msg(){return msg.text;},act,setEndT(t){endT=t;}};
</script>
