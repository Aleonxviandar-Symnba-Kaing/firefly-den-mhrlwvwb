<script>
'use strict';
// ================= CORE =================
const W = 256, H = 144, GROUND = 126, ROUND_TIME = 60, JUMP_Y = 104;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
ctx.imageSmoothingEnabled = false;

function resize() {
  const vw = window.innerWidth, vh = window.innerHeight - (window.innerHeight>window.innerWidth&&window.innerWidth<=700?40:0);
  const dpr = window.devicePixelRatio || 1;
  let s = Math.min(vw / W, vh / H);
  let dp = Math.floor(s * dpr); if (dp < 1) dp = 1;
  s = dp / dpr;
  cv.style.width = (W * s) + 'px';
  cv.style.height = (H * s) + 'px';
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 200));
resize();

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const srnd = mulberry32(1337);       // deterministic scene
const R = Math.random;
const BAYER = [0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5];
const clamp = (v,a,b)=>v<a?a:v>b?b:v;

function mk(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');g.imageSmoothingEnabled=false;return [c,g];}
function pset(g,x,y,c){g.fillStyle=c;g.fillRect(Math.round(x),Math.round(y),1,1);}
function hexRgb(h){h=h.replace('#','');return [parseInt(h.substr(0,2),16),parseInt(h.substr(2,2),16),parseInt(h.substr(4,2),16)];}

// ================= PIXEL FONT (3x5) =================
const FONT = {
A:[2,5,7,5,5],B:[6,5,6,5,6],C:[3,4,4,4,3],D:[6,5,5,5,6],E:[7,4,6,4,7],F:[7,4,6,4,4],G:[3,4,5,5,3],
H:[5,5,7,5,5],I:[7,2,2,2,7],J:[1,1,1,5,2],K:[5,5,6,5,5],L:[4,4,4,4,7],M:[5,7,5,5,5],N:[6,5,5,5,5],
O:[2,5,5,5,2],P:[6,5,6,4,4],Q:[2,5,5,6,3],R:[6,5,6,5,5],S:[3,4,2,1,6],T:[7,2,2,2,2],U:[5,5,5,5,7],
V:[5,5,5,5,2],W:[5,5,5,7,5],X:[5,5,2,5,5],Y:[5,5,2,2,2],Z:[7,1,2,4,7],
'0':[7,5,5,5,7],'1':[2,6,2,2,7],'2':[6,1,2,4,7],'3':[6,1,2,1,6],'4':[5,5,7,1,1],'5':[7,4,6,1,6],
'6':[3,4,6,5,2],'7':[7,1,2,2,2],'8':[2,5,2,5,2],'9':[2,5,3,1,6],
'!':[2,2,2,0,2],"'":[2,2,0,0,0],'.':[0,0,0,0,2],',':[0,0,0,2,4],':':[0,2,0,2,0],'-':[0,0,7,0,0],
'/':[1,1,2,4,4],'?':[6,1,2,0,2],'(':[1,2,2,2,1],')':[4,2,2,2,4],'+':[0,2,7,2,0],'&':[2,5,2,5,3],
'<':[1,2,4,2,1],'>':[4,2,1,2,4],'^':[2,5,0,0,0],'*':[0,5,2,5,0],' ':[0,0,0,0,0],'~':[0,3,6,0,0]
};
function textW(s,sc){return s.length*4*sc-sc;}
function rawText(s,x,y,sc,col,grad){
  for(let i=0;i<s.length;i++){
    const g=FONT[s[i]]||FONT['?'];
    for(let r=0;r<5;r++){
      const b=g[r]; if(!b) continue;
      ctx.fillStyle = grad ? grad[r] : col;
      for(let c=0;c<3;c++) if(b&(4>>c)) ctx.fillRect(x+i*4*sc+c*sc, y+r*sc, sc, sc);
    }
  }
}
// opts: {c, s, align, shadow, outline, grad}
function drawText(str,x,y,o){
  o=o||{}; const s=String(str).toUpperCase().replace(/—/g,'-'); const sc=o.s||1;
  const w=textW(s,sc);
  if(o.align==='center') x-=Math.floor(w/2); else if(o.align==='right') x-=w;
  x=Math.round(x); y=Math.round(y);
  if(o.outline){
    for(let dx=-1;dx<=1;dx++)for(let dy=-1;dy<=1;dy++) if(dx||dy) rawText(s,x+dx,y+dy,sc,o.outline);
  }
  if(o.shadow){ const so=Math.max(1,Math.floor(sc/2)); rawText(s,x+so,y+so,sc,o.shadow); }
  rawText(s,x,y,sc,o.c||'#fff',o.grad);
  return w;
}

// ================= SPRITES =================
function makeSprite(rows,pal,outline){
  const h=rows.length, w=Math.max(...rows.map(r=>r.length));
  const pad=outline?1:0;
  const [c,g]=mk(w+pad*2,h+pad*2);
  const filled=(i,j)=>{if(j<0||j>=h)return false;const ch=rows[j][i];return ch&&ch!=='.'&&ch!==' '&&pal[ch];};
  if(outline){
    g.fillStyle=outline;
    for(let j=-1;j<=h;j++)for(let i=-1;i<=w;i++){
      if(filled(i,j))continue;
      if(filled(i-1,j)||filled(i+1,j)||filled(i,j-1)||filled(i,j+1)) g.fillRect(i+pad,j+pad,1,1);
    }
  }
  for(let j=0;j<h;j++)for(let i=0;i<rows[j].length;i++){
    const ch=rows[j][i]; if(!filled(i,j))continue;
    g.fillStyle=pal[ch]; g.fillRect(i+pad,j+pad,1,1);
  }
  return c;
}

// Leon (faces right). 17 wide.

];
const badgerSpr=makeSprite(BADGER_ROWS,{g:'#8a8aa0',G:'#a8a8bc',K:'#22202c',W:'#f0f0f4',E:'#22202c',N:'#111',k:'#3a3848'},OUT);
const HERON_ROWS=[

function makeGlow(r,rgb,a0){
  const s=r*2+1; const [c,g]=mk(s,s); const id=g.createImageData(s,s);
  for(let j=0;j<s;j++)for(let i=0;i<s;i++){
    const d=Math.hypot(i-r,j-r)/(r+0.5); if(d>1)continue;
    let a=Math.ceil((1-d)*4)/4; a=a*a*a0;
    const k=(j*s+i)*4; id.data[k]=rgb[0];id.data[k+1]=rgb[1];id.data[k+2]=rgb[2];id.data[k+3]=Math.round(a*255);
  }
  g.putImageData(id,0,0); return c;
}
const GLOW_FLY=makeGlow(6,[180,255,90],0.75);
const GLOW_FLY_S=makeGlow(3,[220,255,140],0.9);
const GLOW_GOLD=makeGlow(9,[255,200,60],0.8);
const GLOW_BLUE=makeGlow(14,[70,170,255],0.55);
const GLOW_MOON=makeGlow(22,[190,170,255],0.35);
const GLOW_HEART=makeGlow(4,[255,230,120],0.8);
const GLOW_WARM=makeGlow(3,[255,190,90],0.7);
function glow(g,x,y,a){ctx.globalAlpha=clamp(a,0,1);ctx.drawImage(g,Math.round(x)-(g.width>>1),Math.round(y)-(g.height>>1));ctx.globalAlpha=1;}

// ================= SCENE PRE-RENDER =================
const bankTop = x => 102 + Math.round(Math.sin(x*0.05)*1.5 + Math.sin(x*0.13+1)*1);
const fgTop = x => 136 + Math.round(Math.sin(x*0.07)*2 + Math.sin(x*0.19+2));

// --- sky ---
const [skyC,sg]=mk(W,H);
(function(){
  const pal=[[12,9,36],[19,13,52],[28,18,70],[40,24,86],[54,32,102],[74,42,114],[98,56,124]].map(a=>a);
  const id=sg.createImageData(W,H);
  for(let y=0;y<H;y++){
    const t=Math.min(1,y/94), f=t*(pal.length-1), i=Math.min(pal.length-2,Math.floor(f)), fr=f-i;
    for(let x=0;x<W;x++){
      const th=(BAYER[(y&3)*4+(x&3)]+0.5)/16; const c=fr>th?pal[i+1]:pal[i];
      const k=(y*W+x)*4; id.data[k]=c[0];id.data[k+1]=c[1];id.data[k+2]=c[2];id.data[k+3]=255;
    }
  }
  sg.putImageData(id,0,0);
  // milky way
  for(let i=0;i<700;i++){
    const u=srnd(); const bx=u*W; const by=70-u*66+(srnd()+srnd()+srnd()-1.5)*14;
    sg.fillStyle=srnd()<0.5?'rgba(150,120,210,0.22)':'rgba(120,110,200,0.15)';
    sg.fillRect(Math.round(bx),Math.round(by),1,1);
  }
  // stars
  for(let i=0;i<110;i++){
    const x=Math.floor(srnd()*W); const y=Math.floor(Math.pow(srnd(),1.4)*88);
    const c=['#ffffff','#d8dcff','#ffe8b8','#b8b0ff'][Math.floor(srnd()*4)];
    sg.globalAlpha=0.4+srnd()*0.6; pset(sg,x,y,c);
  }
  sg.globalAlpha=1;
})();
const TWINKLES=[];
for(let i=0;i<16;i++) TWINKLES.push({x:8+Math.floor(srnd()*240),y:4+Math.floor(srnd()*70),p:srnd()*6.28,s:1+srnd()*2});

// --- moon sprite ---
const [moonC,mg]=mk(24,24);
(function(){
  const cx=11.5,cy=11.5;
  for(let j=0;j<24;j++)for(let i=0;i<24;i++){
    const d1=Math.hypot(i-cx,j-cy), d2=Math.hypot(i-(cx+4.5),j-(cy-3));
    if(d1<=9.6 && d2>8.2){
      let c='#fff4cc';
      if(d2<9.4) c='#e4d090';
      else if(d1>8.6) c='#f0e2a8';
      mg.fillStyle=c; mg.fillRect(i,j,1,1);
    }
  }
  [[5,13],[6,16],[4,10],[8,18]].forEach(p=>pset(mg,p[0],p[1],'#e0cc90'));
})();

// --- hills + river base ---
const [hillC,hg]=mk(W,H);
const COTTAGE={x:150,y:0};
(function(){
  for(let x=0;x<W;x++){
    const t1=Math.round(80+Math.sin(x*0.03+1)*4+Math.sin(x*0.08)*2);
    for(let y=t1;y<92;y++) pset(hg,x,y,y===t1?'#3a2a66':'#2a1d52');
  }
  // cottage on far hill
  const cx=COTTAGE.x, cyTop=Math.round(80+Math.sin(cx*0.03+1)*4+Math.sin(cx*0.08)*2);
  COTTAGE.y=cyTop-3;
  hg.fillStyle='#22184a'; hg.fillRect(cx-3,cyTop-5,7,5);
  for(let k=0;k<5;k++){hg.fillRect(cx-4+k,cyTop-6-k,9-2*k,1);}
  hg.fillRect(cx+2,cyTop-10,1,3);
  for(let x=0;x<W;x++){
    const t2=Math.round(86+Math.sin(x*0.05+3)*3+Math.sin(x*0.11)*1.5);
    for(let y=t2;y<92;y++) pset(hg,x,y,'#1c1540');
  }
  // pines
  for(let i=0;i<14;i++){
    const px=Math.floor(srnd()*W); if(Math.abs(px-COTTAGE.x)<10) continue;
    const base=Math.round(86+Math.sin(px*0.05+3)*3+Math.sin(px*0.11)*1.5)+1; const h=4+Math.floor(srnd()*6);
    for(let k=0;k<h;k++){const hw=Math.floor(k/2.5); hg.fillStyle='#161034'; hg.fillRect(px-hw,base-h+k,hw*2+1,1);}
  }
  // river
  for(let y=92;y<110;y++)for(let x=0;x<W;x++){
    let c='#1a2660';
    if(y===92) c='#4a5aa0';
    else if(y===93) c=(x&1)?'#2a3a7a':'#1e2c68';
    else { const th=(BAYER[(y&3)*4+(x&3)]+0.5)/16; c=((y-94)/12)>th?'#132050':'#1a2862'; }
    pset(hg,x,y,c);
  }
})();
const RIPPLES=[];
for(let i=0;i<22;i++) RIPPLES.push({x:srnd()*W,y:94+Math.floor(srnd()*9),l:2+Math.floor(srnd()*5),s:(srnd()<0.5?-1:1)*(2+srnd()*4)});

// --- land: bank, tree, rune stone, vines, peonies ---
const [landC,lg]=mk(W,H);
const JARS=[{x:12,y:84},{x:17,y:84},{x:22,y:84},{x:63,y:31}];
const STONE={cx:204,top:88,bot:113};
const RUNE_PX=[];
function peony(g,x,y,big,white){
  const pal=white?{p:'#b8a8c8',P:'#e8e0f0',L:'#fff8ff',l:'#ffffff'}:{p:'#a83a6e',P:'#e0709e',L:'#ffa8cc',l:'#ffe4f0'};
  const rows=big?[".pPp.","pPLPp","PLlLP","pPLPp",".pPp."]:[".P.","PlP",".P."];
  for(let j=0;j<rows.length;j++)for(let i=0;i<rows[j].length;i++){const ch=rows[j][i];if(ch!=='.')pset(g,x+i,y+j,pal[ch]);}
}
function bush(g,x,y,w,h){
  for(let j=0;j<h;j++)for(let i=0;i<w;i++){
    const dx=(i-w/2)/(w/2), dy=(j-h)/h; if(dx*dx+dy*dy>1)continue;
    const th=(BAYER[(j&3)*4+(i&3)]+0.5)/16;
    let c=(-dy)>0.6&&dx>-0.2&&th>0.4?'#3a8a4c':'#1e5a32';
    if(th<0.15)c='#2a6e3e';
    pset(g,x+i-Math.floor(w/2),y+j-h,c);
  }
}
(function(){
  // bank
  for(let x=0;x<W;x++){
    const t=bankTop(x);
    for(let y=t;y<H;y++){
      let c;
      if(y===t) c='#5aa860'; else if(y===t+1) c='#3e8a4a';
      else { const f=(y-t)/(H-t); const th=(BAYER[(y&3)*4+(x&3)]+0.5)/16;
        c = f<0.35 ? (f/0.35>th?'#28603a':'#2f6e40') : (((f-0.35)/0.65)>th?'#1a4028':'#28603a'); }
      pset(lg,x,y,c);
    }
    if(srnd()<0.35){const h=1+Math.floor(srnd()*3); for(let k=1;k<=h;k++) pset(lg,x,t-k,'#3e8a4a');}
  }
  // grass tufts and tiny flowers
  for(let i=0;i<120;i++){
    const x=Math.floor(srnd()*W), y=104+Math.floor(srnd()*36);
    pset(lg,x,y,'#3a8048'); pset(lg,x-1,y+1,'#3a8048'); pset(lg,x+1,y+1,'#3a8048');
  }
  for(let i=0;i<40;i++){
    const x=Math.floor(srnd()*W), y=106+Math.floor(srnd()*30);
    pset(lg,x,y,['#e8e8ff','#7ab8ff','#ffb0d0','#fff0a0'][Math.floor(srnd()*4)]);
  }
  // cattails
  [[96,8],[99,10],[102,7],[160,9],[163,11],[167,8],[248,9],[251,7]].forEach(([x,h])=>{
    const t=bankTop(x);
    for(let k=0;k<h;k++) pset(lg,x,t-k,'#2e6a3c');
    lg.fillStyle='#6a4228'; lg.fillRect(x,t-h-2,1,3); pset(lg,x,t-h-3,'#2e6a3c');
    pset(lg,x+1,t-3,'#3e8a4a'); pset(lg,x-1,t-5,'#3e8a4a');
  });
  // back peony bushes
  [[80,112,16,8],[138,111,14,7],[178,113,16,8]].forEach(([x,y,w,h],n)=>{
    bush(lg,x,y,w,h);
    peony(lg,x-6,y-7,true,n===1); peony(lg,x+1,y-8,true,false); peony(lg,x+4,y-4,false,true);
  });

  // ---- hollow tree ----
  // branch
  for(let x=28;x<=80;x++){
    const y=Math.round(20-(x-28)*0.05+Math.sin(x*0.2)*0.6);
    pset(lg,x,y-1,'#5a4058'); pset(lg,x,y,'#3a2838'); if(x<60)pset(lg,x,y+1,'#2a1c2c');
  }
  for(let y=0;y<=110;y++){
    const fl=Math.max(0,y-88)*0.8, wob=Math.round(Math.sin(y*0.15));
    const l=Math.round(5-fl+wob), r=Math.round(31+fl*1.1+wob);
    for(let x=Math.max(0,l);x<=r;x++){
      let c='#3c2a3c';
      if(x<=l+1)c='#22162a'; else if(x>=r-1)c='#6e4e66'; else if(x>=r-3)c='#523a54';
      pset(lg,x,y,c);
    }
  }
  for(let i=0;i<30;i++){
    const x=7+Math.floor(srnd()*22), y0=Math.floor(srnd()*100), len=3+Math.floor(srnd()*8);
    for(let k=0;k<len;k++) pset(lg,x,y0+k,'#2a1c2e');
  }
  // roots
  [[8,104,-1,10],[30,104,1,16],[20,107,0.4,10],[12,106,-0.6,8]].forEach(([x,y,dx,len])=>{
    for(let k=0;k<len;k++){const xx=x+dx*k, yy=y+k*0.55; pset(lg,xx,yy,'#3c2a3c'); pset(lg,xx,yy-1,'#6e4e66'); pset(lg,xx+1,yy,'#3c2a3c');}
  });
  // hollow
  const hx=19,hy=82,rx=8,ry=12;
  for(let j=-ry-1;j<=ry+1;j++)for(let i=-rx-1;i<=rx+1;i++){
    const d=Math.hypot(i/rx,j/ry);
    if(d<=0.86) pset(lg,hx+i,hy+j,'#0a0510');

function tone(freq,start,dur,type,vol,dest,slideTo){

  g.gain.setValueAtTime(0.0001,start);
  g.gain.exponentialRampToValueAtTime(vol,start+0.008);
  g.gain.exponentialRampToValueAtTime(0.0001,start+dur);

}

function updateFlies(dt){
  for(let i=flies.length-1;i>=0;i--){
    const f=flies[i]; f.t+=dt;
    f.alpha=Math.min(1,f.alpha+dt*1.2);
    f.x+=f.vx*dt+Math.sin(time*0.7+f.wob)*5*dt;
    if(!f.gold){
      if(f.x<8) f.vx=Math.abs(f.vx); if(f.x>W-8) f.vx=-Math.abs(f.vx);
      f.baseY=clamp(f.baseY+Math.sin(time*0.4+f.wob)*5*dt,58,118);
    } else {
      if(f.x<-14||f.x>W+14){ flies.splice(i,1); continue; }
      if(R()<dt*20) parts.push({x:f.x+(R()-0.5)*3,y:f.y+(R()-0.5)*3,vx:-f.vx*0.1,vy:8,life:0.5,max:0.5,c:'#ffe070',star:false});
    }
    f.y=f.baseY+Math.sin(time*f.freq+f.phase)*f.amp;
  }
}
function update(dt){
  time+=dt; jarPulse=Math.max(0,jarPulse-dt*2.5);
  // shooting star
  shootT-=dt;
  if(shootT<=0&&!shoot){ shoot={x:40+R()*170,y:6+R()*20,vx:110+R()*50,vy:40+R()*20,life:0.6}; shootT=7+R()*8; }
  if(shoot){ shoot.x+=shoot.vx*dt; shoot.y+=shoot.vy*dt; shoot.life-=dt; if(shoot.life<=0) shoot=null; }

  updateFlies(dt);

  // leon blink
  leon.blinkT-=dt; if(leon.blinkT<=0){leon.blink=0.13;leon.blinkT=2+R()*3;} leon.blink=Math.max(0,leon.blink-dt);

  if(state==='play'){
    roundT+=dt; hintT=Math.max(0,hintT-dt);

    if(left<=5&&sec!==lastTick&&sec>0){ lastTick=sec; sfxTick(); }
    let dir=0;
    if(keys.arrowleft||keys.a) dir-=1;
    if(keys.arrowright||keys.d) dir+=1;
    if(dir===0&&pointer.active){ const d=pointer.x-leon.x; if(Math.abs(d)>3) dir=Math.sign(d); }
    const target=dir*78;
    leon.vx+=(target-leon.vx)*Math.min(1,dt*12);
    if(pointer.active&&dir===0&&Math.abs(pointer.x-leon.x)<=3) leon.vx*=0.5;
    leon.x=clamp(leon.x+leon.vx*dt,8,W-8);
    if(dir) leon.facing=dir;
    jumpBuf-=dt;
    if(jumpBuf>0&&leon.onGround){ leon.vy=-232; leon.onGround=false; jumpBuf=0; sfxJump(); }
    if(!leon.onGround){
      leon.vy+=540*dt; leon.y+=leon.vy*dt;
      if(leon.y>=GROUND){ leon.y=GROUND; leon.vy=0; leon.onGround=true; sfxLand();
        for(let i=0;i<5;i++) parts.push({x:leon.x+(R()-0.5)*10,y:GROUND-1,vx:(R()-0.5)*20,vy:-5-R()*8,life:0.35,max:0.35,c:'#6a9a6a',star:false}); }
    }
    if(Math.abs(leon.vx)>10&&leon.onGround) leon.walkT+=dt*10; else if(leon.onGround) leon.walkT=0;

      const f=flies[i]; if(f.alpha<0.6) continue;

        pops.push({x:f.x,y:f.y-6,t:0,txt:'+'+pts,gold:f.gold});

  } else if(state==='ending'){

  } else if(state==='end'){

    const cx=q.sx, cy=Math.min(q.sy-30,40), tx=10, ty=12;
    q.x=(1-e)*(1-e)*q.sx+2*(1-e)*e*cx+e*e*tx; q.y=(1-e)*(1-e)*q.sy+2*(1-e)*e*cy+e*e*ty;
    if(R()<dt*30) parts.push({x:q.x,y:q.y,vx:(R()-0.5)*6,vy:(R()-0.5)*6,life:0.35,max:0.35,c:q.gold?'#ffe070':'#d8ff80',star:R()<0.3});
    if(k>=1){ flyers.splice(i,1); shownScore+=q.pts; jarPulse=1; sparkle(10,12,5,q.gold?'#ffe070':'#e8ff90',14); }
  }
  for(let i=parts.length-1;i>=0;i--){const p=parts[i]; p.x+=p.vx*dt; p.y+=p.vy*dt; p.vx*=0.96; p.life-=dt; if(p.life<=0) parts.splice(i,1);}
  for(let i=pops.length-1;i>=0;i--){const p=pops[i]; p.t+=dt; if(p.t>0.9) pops.splice(i,1);}
}

function drawHeart(x,y,c,a){ ctx.globalAlpha=a; ctx.fillStyle=c; ctx.fillRect(x-1,y,1,1);ctx.fillRect(x+1,y,1,1);ctx.fillRect(x-1,y+1,3,1);ctx.fillRect(x,y+2,1,1); ctx.globalAlpha=1; }

}
