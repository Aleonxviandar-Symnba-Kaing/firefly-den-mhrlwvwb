function resize(){

  let s=Math.min(vw/W,vh/H);
  let dp=Math.floor(s*dpr); if(dp<1) dp=1;
  s=dp/dpr;
  if(W*s>vw+0.5||H*s>vh+0.5) s=Math.min(vw/W,vh/H);
  cv.style.width=(W*s)+'px'; cv.style.height=(H*s)+'px';
}

// ---------- palette decay transform ----------
let TF=null; const tcache=new Map();
function setTF(tf){if(TF===tf)return;TF=tf;tcache.clear();}
function TC(hex){
  if(!TF) return hex;
  let v=tcache.get(hex); if(v) return v;
  let [r,g,b]=hexRgb(hex);
  if(TF.wrong){ const nr=r*0.84+b*0.24, ng=g*0.9+r*0.08, nb=b*0.74+g*0.3; r=nr;g=ng;b=nb; }
  const gr=0.3*r+0.59*g+0.11*b;
  r+=(gr-r)*TF.s; g+=(gr-g)*TF.s; b+=(gr-b)*TF.s;
  const ta=TF.ta;
  r=r*(1-ta)+r*TF.tint[0]*ta; g=g*(1-ta)+g*TF.tint[1]*ta; b=b*(1-ta)+b*TF.tint[2]*ta;
  r*=TF.dark; g*=TF.dark; b*=TF.dark;
  v=rgbHex(r,g,b); tcache.set(hex,v); return v;
}
function ps(g,x,y,hex){g.fillStyle=TC(hex);g.fillRect(Math.round(x),Math.round(y),1,1);}
function pr(g,x,y,w,h,hex){g.fillStyle=TC(hex);g.fillRect(Math.round(x),Math.round(y),w,h);}

function textW(s,sc){return s.length*4*sc-sc;}
function rawText(s,x,y,sc,col,grad,wave){
  for(let i=0;i<s.length;i++){
    const g=FONT[s[i]]||FONT['?'];
    const oy=wave?Math.round(wave(i)):0;
    for(let r=0;r<5;r++){
      const b=g[r]; if(!b) continue;
      ctx.fillStyle=grad?grad[r]:col;
      for(let c=0;c<3;c++) if(b&(4>>c)) ctx.fillRect(x+i*4*sc+c*sc,y+oy+r*sc,sc,sc);
    }
  }
}
function drawText(str,x,y,o){
  o=o||{}; const s=String(str).toUpperCase(); const sc=o.s||1;
  const w=textW(s,sc);
  if(o.align==='center') x-=Math.floor(w/2); else if(o.align==='right') x-=w;
  x=Math.round(x); y=Math.round(y);
  if(o.outline){ for(let dx=-1;dx<=1;dx++)for(let dy=-1;dy<=1;dy++) if(dx||dy) rawText(s,x+dx,y+dy,sc,o.outline,null,o.wave); }
  if(o.shadow){ const so=Math.max(1,Math.floor(sc/2)); rawText(s,x+so,y+so,sc,o.shadow,null,o.wave); }
  rawText(s,x,y,sc,o.c||'#fff',o.grad,o.wave);
  return w;
}
const GLCH='#?!/*~<>01_';
function glitch(s,amt,seed){
  if(amt<=0) return s; const a=s.split('');
  for(let i=0;i<a.length;i++){
    if(a[i]===' ') continue; const h=hsh(seed*7.31+i*1.79);
    if(h<amt*0.45&&i<a.length-1&&a[i+1]!==' '){const t=a[i];a[i]=a[i+1];a[i+1]=t;i++;}
    else if(h>1-amt*0.22) a[i]=GLCH[(hsh(seed*3.7+i)*GLCH.length)|0];
  }
  return a.join('');
}

// ---------- sprites ----------
function makeSprite(rows,pal,outline){
  const h=rows.length, w=Math.max(...rows.map(r=>r.length));
  const pad=outline?1:0;
  const [c,g]=mk(w+pad*2,h+pad*2);
  const filled=(i,j)=>{if(j<0||j>=h||i<0)return false;const ch=rows[j][i];return ch&&ch!=='.'&&ch!==' '&&pal[ch];};
  if(outline){
    g.fillStyle=outline;
    for(let j=-1;j<=h;j++)for(let i=-1;i<=w;i++){
      if(filled(i,j))continue;
      if(filled(i-1,j)||filled(i+1,j)||filled(i,j-1)||filled(i,j+1)) g.fillRect(i+pad,j+pad,1,1);
    }
  }
  for(let j=0;j<h;j++)for(let i=0;i<rows[j].length;i++){
    if(!filled(i,j))continue; g.fillStyle=pal[rows[j][i]]; g.fillRect(i+pad,j+pad,1,1);
  }
  return c;
}
function scaleRows(rows,s){
  const h=rows.length,w=Math.max(...rows.map(r=>r.length)); const nh=Math.round(h*s),nw=Math.round(w*s); const out=[];
  for(let j=0;j<nh;j++){let row='';for(let i=0;i<nw;i++){row+=rows[Math.min(h-1,Math.floor(j/s))][Math.min(w-1,Math.floor(i/s))]||'.';}out.push(row);}
  return out;
}

// ---------- glows ----------
function makeGlow(r,rgb,a0,steps){
  steps=steps||4; const s=r*2+1; const [c,g]=mk(s,s); const id=g.createImageData(s,s);
  for(let j=0;j<s;j++)for(let i=0;i<s;i++){
    const d=Math.hypot(i-r,j-r)/(r+0.5); if(d>1)continue;
    let a=Math.ceil((1-d)*steps)/steps; a=a*a*a0;
    const k=(j*s+i)*4; id.data[k]=rgb[0];id.data[k+1]=rgb[1];id.data[k+2]=rgb[2];id.data[k+3]=Math.round(a*255);
  }
  g.putImageData(id,0,0); return c;
}
const glowCache=new Map();
function getGlow(r,rgb,a0){r=Math.max(1,Math.round(r));const k=r+'|'+rgb.join(',')+'|'+a0;let c=glowCache.get(k);if(!c){c=makeGlow(r,rgb,a0);glowCache.set(k,c);}return c;}
function glowAdd(r,rgb,a0,x,y,a){
  const gc=getGlow(r,rgb,a0); ctx.globalCompositeOperation='lighter'; ctx.globalAlpha=clamp(a,0,1);
  ctx.drawImage(gc,Math.round(x)-(gc.width>>1),Math.round(y)-(gc.height>>1));
  ctx.globalAlpha=1; ctx.globalCompositeOperation='source-over';
}
function makeLight(r){ // stepped radial mask for darkness punching
  const s=r*2+1; const [c,g]=mk(s,s); const id=g.createImageData(s,s);
  for(let j=0;j<s;j++)for(let i=0;i<s;i++){
    const d=Math.hypot(i-r,j-r)/(r+0.5); if(d>1)continue;
    const th=(BAYER[(j&3)*4+(i&3)]+0.5)/16;
    const a=clamp((1-d)*1.6,0,1); const q=Math.floor(a*4+th*0.999)/4;
    const k=(j*s+i)*4; id.data[k]=255;id.data[k+1]=255;id.data[k+2]=255;id.data[k+3]=Math.round(clamp(q,0,1)*255);
  }
  g.putImageData(id,0,0); return c;
}

function genSky(cols){

    for(let x=0;x<W;x++){
      const th=(BAYER[(y&3)*4+(x&3)]+0.5)/16; const cc=fr>th?pal[i+1]:pal[i];
      const k=(y*W+x)*4; id.data[k]=cc[0];id.data[k+1]=cc[1];id.data[k+2]=cc[2];id.data[k+3]=255;
    }
  }

}
function blob(g,cx,cy,r,c1,c2,c3){

    const d=Math.hypot(i,j)/r; if(d>1)continue; const x=cx+i,y=cy+j;
    const th=(BAYER[(mod(y,4))*4+mod(x,4)]+0.5)/16; const lit=(-i*0.5-j*0.8)/r;
    let c=c1; if(lit>0.3&&th<0.7) c=c2; if(lit>0.6&&th<0.4) c=c3;
    ps(g,mod(x,TW),y,c);
  }
}

function bushT(g,x,base,w,h,n,rng){

    const xx=Math.round(x+i-w/2), yy=base+j-h; const th=(BAYER[(mod(yy,4))*4+mod(xx,4)]+0.5)/16;
    let c=(-dy)>0.6&&dx>-0.2&&th>0.4?'#48b05a':'#226a36'; if(th<0.15)c='#2e8044';

  }
}
function palm(g,bx,by,h,lean,n,rng,flip){

    ps(g,mod(x-1,TW),y,band?'#5a3a20':'#7a5230'); ps(g,mod(x,TW),y,band?'#7a5230':'#a8784a'); ps(g,mod(x+1,TW),y,band?'#7a5230':'#c8985a');
    if(k<4){ ps(g,mod(x-2,TW),y,'#5a3a20'); ps(g,mod(x+2,TW),y,'#7a5230'); }
    tx=x;ty=y;

  const nf=[0,8,7,6,5,4,4][n]; const droop=[0,0.15,0.3,0.5,0.9,1.2,1.4][n];
  for(let f=0;f<nf;f++){
    const a=-Math.PI/2+(f/(nf-1)-0.5)*Math.PI*1.3+(rng()-0.5)*0.2;
    const len=15+rng()*9;
    for(let s=0;s<len;s++){
      const q=s/len; const px=tx+Math.cos(a)*s, py=ty+Math.sin(a)*s+droop*q*q*len*0.9+q*q*len*0.3;
      ps(g,mod(Math.round(px),TW),py,'#2e8a3e');

    }

  else if(!flip) FRUITS.push({x:mod(tx+(rng()<0.5?-4:4),TW),y:ty+5,ph:rng()*6});

}
function vine(g,x,len,n,rng){

    const vx=Math.round(x+Math.sin(j*0.35+x)*1.2);
    ps(g,mod(vx,TW),j,'#2a6a3a');
    if(j%3===1){ const s=(j%6===1)?-1:1; ps(g,mod(vx+s,TW),j,'#4aa05a'); }
  }
  if(n<=2){ const ex=Math.round(x+Math.sin((len-1)*0.35+x)*1.2); ps(g,mod(ex,TW),len,'#ff7aa0');ps(g,mod(ex,TW),len+1,'#ffe060'); }
}

function genCloud(rng){

function cutout(rows,kind){
  const pal={}; rows.join('').split('').forEach(ch=>{if(ch!=='.')pal[ch]='#9a7650';});
  const s=makeSprite(rows,pal,'#4a3220'); const g=s.getContext('2d');
  g.fillStyle='#7a5a3a'; for(let i=0;i<14;i++) g.fillRect(Math.floor(hsh(i+(kind==='b'?1:9))*s.width),Math.floor(hsh(i*2.3)*s.height),1,1);
  g.fillStyle='#000';
  if(kind==='b'){ g.fillRect(11,4,1,1); g.fillRect(13,4,1,1); g.fillRect(7,6,8,1); g.fillRect(6,5,1,1); g.fillRect(15,5,1,1); g.fillStyle='#f4f0e8'; for(let i=8;i<15;i+=2) g.fillRect(i,6,1,1); }

let actx=null, master=null, musicGain=null, sfxGain=null, pulseW=null, noiseBuf=null;
let muted=false; try{ muted=localStorage.getItem('leonDescentMute')==='1'; }catch(e){}
const mf=m=>440*Math.pow(2,(m-69)/12);
const now=()=>actx?actx.currentTime:0;
function initAudio(){
  try{
    if(actx){ if(actx.state==='suspended') actx.resume(); return; }
    const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
    actx=new AC();
    master=actx.createGain(); master.gain.value=muted?0:0.5; master.connect(actx.destination);
    musicGain=actx.createGain(); musicGain.gain.value=0.34; musicGain.connect(master);
    sfxGain=actx.createGain(); sfxGain.gain.value=0.7; sfxGain.connect(master);
    const n=24, re=new Float32Array(n), im=new Float32Array(n);
    for(let k=1;k<n;k++) re[k]=2*Math.sin(k*Math.PI*0.25)/(k*Math.PI);
    pulseW=actx.createPeriodicWave(re,im);
    noiseBuf=actx.createBuffer(1,actx.sampleRate,actx.sampleRate);
    const d=noiseBuf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
    if(actx.state==='suspended') actx.resume();
  }catch(e){ actx=null; }
}
function tone(freq,start,dur,type,vol,dest,o2){
  if(!actx) return; o2=o2||{};
  const o=actx.createOscillator(), g=actx.createGain();
  if(type==='pulse'&&pulseW) o.setPeriodicWave(pulseW); else o.type=(type==='pulse'?'square':type);
  o.frequency.setValueAtTime(freq,start);
  if(o2.slide) o.frequency.exponentialRampToValueAtTime(o2.slide,start+dur);
  if(o2.cents) o.detune.setValueAtTime(o2.cents,start);
  vol=Math.max(0.0002,vol);
  g.gain.setValueAtTime(0.0001,start);
  if(o2.rev){ g.gain.exponentialRampToValueAtTime(vol,start+dur*0.92); g.gain.linearRampToValueAtTime(0.0001,start+dur); }
  else { g.gain.exponentialRampToValueAtTime(vol,start+(o2.att||0.008)); g.gain.exponentialRampToValueAtTime(0.0001,start+dur); }
  o.connect(g); g.connect(dest||sfxGain); o.start(start); o.stop(start+dur+0.05);
}
function noise(start,dur,vol,dest,hp){
  if(!actx||!noiseBuf) return;
  const s=actx.createBufferSource(); s.buffer=noiseBuf; const f=actx.createBiquadFilter(); f.type='highpass'; f.frequency.value=hp||5000;
  const g=actx.createGain(); g.gain.setValueAtTime(Math.max(0.0002,vol),start); g.gain.exponentialRampToValueAtTime(0.0001,start+dur);
  s.connect(f); f.connect(g); g.connect(dest||sfxGain); s.start(start,Math.random()*0.5); s.stop(start+dur+0.02);
}
let drones=[];
function stopDrones(){ const t=now(); drones.forEach(d=>{try{d.g.gain.cancelScheduledValues(t);d.g.gain.setTargetAtTime(0.0001,t,0.3);d.o.stop(t+1.6);}catch(e){}}); drones=[]; }
function drone(freq,type,vol,lp){
  const o=actx.createOscillator(); o.type=type; o.frequency.value=freq;
  const f=actx.createBiquadFilter(); f.type='lowpass'; f.frequency.value=lp||400;
  const g=actx.createGain(); g.gain.setValueAtTime(0.0001,now()); g.gain.setTargetAtTime(vol,now(),1.2);
  o.connect(f); f.connect(g); g.connect(musicGain); o.start(); drones.push({o,g});
}

function drawCheckerFloor(lights){
  const d=floorID.data; const D0=600/(GROUND-HOR);
  for(let y=HOR;y<H;y++){
    const dy0=Math.max(0.5,y-HOR); const D=600/dy0; const s=D/D0; const fog=clamp(1-D/75,0,1); const v=Math.floor(D/3);
    for(let x=0;x<W;x++){
      const wx=camX+128+(x-128)*s; const u=Math.floor(wx/16); const chk=(u+v)&1;
      let li=0.05; for(const Lt of lights){ const dx=x-Lt.x, dd=(dx*dx+((y-Lt.y)*2.4)**2)/(Lt.r*Lt.r); if(dd<1) li+=(1-dd)*Lt.i; }
      li*=fog; li=Math.min(1,Math.floor(li*7+BAYER[(y&3)*4+(x&3)]/16)/7);
      const k=((y-HOR)*W+x)*4;
      if(chk){ d[k]=70*li+4; d[k+1]=56*li+2; d[k+2]=96*li+6; } else { d[k]=14*li; d[k+1]=8*li; d[k+2]=22*li; }
      d[k+3]=255;
    }
  }
  floorG.putImageData(floorID,0,0); ctx.drawImage(floorC,0,HOR);
}

function toInternal(e){const r=cv.getBoundingClientRect();return {x:(e.clientX-r.left)/r.width*W, y:(e.clientY-r.top)/r.height*H};}

const zoneOf=p=>p.x<W/3?-1:(p.x>W*2/3?1:0);
function advance(){
  if(state==='title'){ startGame(); return true; }

  if(state==='end'&&endT>2.5){ sfxClick(); endSky=null; startGame(); return true; }
  return false;
}
cv.addEventListener('pointerdown',e=>{
  e.preventDefault(); cv.focus&&cv.focus();
  usingTouch=e.pointerType!=='mouse'; initAudio(); inputPulse=true;
  const p=toInternal(e);
  if(inRect(p,{x:MUTE_BTN.x-6,y:0,w:MUTE_BTN.w+10,h:MUTE_BTN.h+8})){ toggleMute(); return; }
  if(advance()) return;
  if(state==='play'){ const z=zoneOf(p); if(z===0) jumpBuf=0.15; ptrs.set(e.pointerId,z); try{cv.setPointerCapture(e.pointerId);}catch(err){} }
},{passive:false});
cv.addEventListener('pointermove',e=>{ if(!ptrs.has(e.pointerId)) return; const z=zoneOf(toInternal(e)); if(z!==ptrs.get(e.pointerId)){ ptrs.set(e.pointerId,z); inputPulse=true; } });
const endPtr=e=>{ ptrs.delete(e.pointerId); };
cv.addEventListener('pointerup',endPtr); cv.addEventListener('pointercancel',endPtr);
cv.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
window.addEventListener('keydown',e=>{
  const kl=(e.key||'').toLowerCase();
  if(['arrowleft','arrowright','arrowup','arrowdown',' ','spacebar','enter'].includes(kl)||e.code==='Space') e.preventDefault();
  if(['shift','control','alt','meta','tab','capslock'].includes(kl)) return;
  usingTouch=false; initAudio(); inputPulse=true;
  if(kl==='m'){ toggleMute(); return; }
  const jumpKey=kl===' '||e.code==='Space'||kl==='arrowup'||kl==='w'||kl==='z';
  if(kl==='enter'||jumpKey){ if(advance()) return; }
  if(state!=='play'&&state!=='fail'){ return; }
  keys[kl]=true; if(e.code==='Space') keys[' ']=true;
  if(jumpKey&&!e.repeat) jumpBuf=0.15;
});
window.addEventListener('keyup',e=>{ const kl=(e.key||'').toLowerCase(); keys[kl]=false; if(e.code==='Space') keys[' ']=false; });
window.addEventListener('blur',()=>{ for(const k in keys) keys[k]=false; ptrs.clear(); });

}
